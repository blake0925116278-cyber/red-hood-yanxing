<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小紅帽管理後台</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f0f0; padding: 10px; margin: 0; color: #333; }
        .header { background: #333; color: #fff; padding: 10px; text-align: center; border-radius: 0 0 15px 15px; }
        .dashboard { background: #fff; margin: 10px 5px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #FBC02D; }
        .stat-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .stat-card { text-align: left; flex: 1; }
        .stat-card span { font-size: 0.8rem; color: #666; }
        .stat-card b { font-size: 1.2rem; color: #d32f2f; display: block; margin-top: 4px; }
        .mode-btns { display: flex; flex-direction: column; gap: 4px; margin-top: 5px; min-width: 88px; }
        .mode-btns button { padding: 6px 8px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold; font-size: 0.8rem; width: 100%; cursor: pointer; background: #f5f5f5; color: #666; }
        .btn-clear { background: #d32f2f; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .order-card { background: #d32f2f; color: #fff; padding: 15px; margin-top: 12px; border-radius: 12px; position: relative; box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3); }
        .order-card.confirmed { background: #e67e22; }
        .order-card.finished { background: #ffffff; color: #888; box-shadow: none; opacity: 0.6; border: 1px solid #ddd; }
        .order-no-badge { position: absolute; right: 10px; top: 10px; background: rgba(255,255,255,0.2); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; border: 1px solid #fff; }
        .item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; }
        .finished .item-row { border-bottom-color: #eee; }
        .note-box { background: #ffeb3b; color: #333; padding: 8px; border-radius: 8px; margin-top: 10px; font-weight: bold; border-left: 5px solid #333; }
        .btn-action { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-confirm { background: #fff; color: #d32f2f; }
        .ready-label { background: rgba(255,255,255,0.2); display: inline-block; padding: 4px 10px; border-radius: 8px; margin-top: 8px; font-weight: bold; }
        .btn-finish { background: #333; color: #fff; }
        .btn-cancel { background: rgba(0,0,0,0.2); color: #fff; border: 1px solid #fff; font-size: 0.9rem; }
        .admin-section { background: #fff; padding: 10px; border-radius: 10px; margin: 15px 5px; border: 1px solid #ddd; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 5px; }
        .s-btn { padding: 8px 2px; font-size: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; }
        .s-btn.off { background: #ffebee; color: #d32f2f; }
        .s-btn.on { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body onclick="initAudio()">

<div class="header">
    <h3 style="margin:0;">小紅帽 訂單管理</h3>
    <button onclick="initAudio()" id="audio-tip" style="background:#ffeb3b; border:none; padding:4px 10px; border-radius:15px; margin-top:5px; font-size:0.75rem; font-weight:bold;">🔔 開啟語音</button>
</div>

<div class="dashboard">
    <div class="stat-row">
        <div class="stat-card"><span>今日營收</span><b id="total-rev">$0</b></div>
        <div class="stat-card"><span>今日總份數</span><b id="total-qty">0 份</b></div>
        <div class="stat-card">
            <span>營業狀態</span>
            <div id="store-mode-btns" style="display:flex; flex-direction:column; gap:4px; margin-top:5px;">
                <button type="button" id="store-btn-open" onclick="setStoreMode('open')">🟢 營業中</button>
                <button type="button" id="store-btn-delivery" onclick="setStoreMode('delivery')">🛵 外送中</button>
                <button type="button" id="store-btn-closed" onclick="setStoreMode('closed')">🔴 休息中</button>
            </div>
        </div>
        <button class="btn-clear" onclick="clearAllOrders()">歸零</button>
    </div>
</div>

<div id="list" style="padding:0 5px;"></div>

<div class="admin-section" style="border-color:#d32f2f">
    <b>⭐ 限定口味:</b>
    <input type="text" id="ltd-n" placeholder="名稱" style="width:80px; padding:5px;">
    <input type="number" id="ltd-p" placeholder="價" style="width:40px; padding:5px;">
    <button onclick="saveLtd()" style="background:#d32f2f; color:#fff; border:none; padding:5px 10px; border-radius:4px;">存</button>
</div>

<div class="admin-section">
    <div id="stock-ctrl" class="stock-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioReady = false; let isFirst = true; let storeMode = 'open';
    window.initAudio = () => { if(!audioReady){ window.speechSynthesis.speak(new SpeechSynthesisUtterance("系統啟動")); audioReady=true; document.getElementById('audio-tip').innerText="✅ 語音已開啟"; }};

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "asc")), (snap) => {
        if (!isFirst && snap.docChanges().some(c => c.type === "added")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("新訂單")); }
        isFirst = false;
        
        const list = document.getElementById('list');
        let rev = 0; let totalQty = 0;
        list.innerHTML = "";
        
        snap.forEach(d => {
            const o = d.data();
            const status = o.status;
            rev += parseInt(String(o.total || '').replace(/[^0-9]/g, '')) || 0;
            const itemStrs = (o.items || '').split(', ').filter(Boolean);
            itemStrs.forEach(str => { totalQty += parseInt(str.split('x')[1]) || 1; });

            const itemsHtml = itemStrs.map(str => `<div class="item-row"><span>${str.split('x')[0]}</span><b>x${str.split('x')[1]||1}</b></div>`).join('');

            const div = document.createElement('div');
            div.className = `order-card ${status}`;
            div.innerHTML = `
                <div class="order-no-badge">#${o.orderNo}</div>
                <div style="font-size:0.85rem; opacity:0.8;">${o.time}${o.memberName ? `　👤 ${o.memberName} ${o.memberPhone || ''}` : ''}</div>
                <div style="margin:10px 0;">${itemsHtml}</div>
                ${o.note && o.note !== "無" ? `<div class="note-box">備註：${o.note}</div>` : ''}
                ${status === 'confirmed' && o.readyTime ? `<div class="ready-label">可取餐 ${o.readyTime}（${o.waitMinutes}分鐘）</div>` : ''}
                
                <div style="margin-top:15px; display:flex; justify-content:space-between; align-items:flex-end; gap:8px;">
                    <b style="font-size:1.5rem;">${o.total}</b>
                    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
                        ${status === 'pending' ? `
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <button class="btn-action btn-confirm" style="flex:1;" onclick="confirmOrder('${d.id}', 5)">接單 5分鐘</button>
                                <button class="btn-action btn-confirm" style="flex:1;" onclick="confirmOrder('${d.id}', 10)">接單 10分鐘</button>
                                <button class="btn-action btn-confirm" style="flex:1;" onclick="confirmOrder('${d.id}', 15)">接單 15分鐘</button>
                            </div>
                            <button class="btn-action btn-cancel" onclick="deleteOrder('${d.id}')">取消</button>
                        ` : ''}
                        ${status === 'confirmed' ? `
                            <div style="display:flex; gap:8px;">
                                <button class="btn-action btn-finish" style="flex:3;" onclick="updateStatus('${d.id}', 'finished')">完成出餐</button>
                                <button class="btn-action btn-cancel" style="flex:1;" onclick="updateStatus('${d.id}', 'pending')">退回</button>
                            </div>
                        ` : ''}
                        ${status === 'finished' ? '<b style="color:#aaa; width:100%; text-align:right;">✓ 已完成</b>' : ''}
                    </div>
                </div>`;
            list.appendChild(div);
        });
        document.getElementById('total-rev').innerText = `$${rev}`;
        document.getElementById('total-qty').innerText = `${totalQty} 份`;
    });

    function paintStoreMode(mode) {
        const styles = {
            open: { bg: '#e8f5e9', color: '#2e7d32' },
            delivery: { bg: '#fff3e0', color: '#e65100' },
            closed: { bg: '#ffebee', color: '#d32f2f' }
        };
        ['open', 'delivery', 'closed'].forEach(m => {
            const btn = document.getElementById('store-btn-' + m);
            if (!btn) return;
            const on = m === mode;
            btn.style.fontWeight = 'bold';
            btn.style.border = on ? '2px solid ' + styles[m].color : '1px solid #ccc';
            btn.style.background = on ? styles[m].bg : '#fff';
            btn.style.color = on ? styles[m].color : '#666';
            btn.style.borderRadius = '8px';
            btn.style.padding = '6px';
            btn.style.cursor = 'pointer';
            btn.style.fontSize = '0.85rem';
        });
    }

    onSnapshot(doc(db, "settings", "storeStatus"), s => {
        const data = s.exists() ? s.data() : { isOpen: true };
        storeMode = data.mode || (data.isOpen === false ? 'closed' : 'open');
        paintStoreMode(storeMode);
    });

    window.setStoreMode = async (mode) => {
        await setDoc(doc(db, "settings", "storeStatus"), { isOpen: mode === 'open', mode: mode });
    };
    window.updateStatus = async (id, s) => { await updateDoc(doc(db, 'orders', id), { status: s }); };
    window.confirmOrder = async (id, minutes) => {
        const ready = new Date(Date.now() + minutes * 60000);
        const readyTime = ready.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
        await updateDoc(doc(db, 'orders', id), { status: 'confirmed', waitMinutes: minutes, readyTime: readyTime });
    };
    window.deleteOrder = async (id) => { if(confirm("確定要取消這筆訂單嗎？")) await deleteDoc(doc(db, "orders", id)); };
    window.clearAllOrders = async () => { if(confirm("確定歸零嗎？")){ const q = await getDocs(collection(db, "orders")); const b = writeBatch(db); q.forEach(d=>b.delete(d.ref)); await b.commit(); }};

    const baseItems = ["古早原味","爆漿奶油","熔岩巧克力","肉鬆沙拉","黃金起司","玉米起司","鮪魚起司","半月OREO","蛋黃奶酥"];
    let curLtd = "";
    function updateStockUI(sList) {
        let all = [...baseItems]; if(curLtd) all.push(curLtd);
        document.getElementById('stock-ctrl').innerHTML = all.map(n => `<button class="s-btn ${sList.includes(n)?'off':'on'}" onclick="toggleSold('${n}',${sList.includes(n)})">${n}</button>`).join('');
        window.curSold = sList;
    }
    onSnapshot(doc(db, "settings", "menuStatus"), s => updateStockUI(s.exists() ? s.data().soldOut || [] : []));
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ curLtd = s.data().name; getDoc(doc(db, "settings", "menuStatus")).then(ss => updateStockUI(ss.exists() ? ss.data().soldOut || [] : [])); }});
    window.toggleSold = async (n, isS) => { await setDoc(doc(db, "settings", "menuStatus"), { soldOut: isS ? window.curSold.filter(i=>i!==n) : [...window.curSold, n] }); };
    window.saveLtd = async () => { await setDoc(doc(db, "settings", "limitedEdition"), { name: document.getElementById('ltd-n').value, price: Number(document.getElementById('ltd-p').value) }); alert("OK"); };
</script>
</body>
</html>
