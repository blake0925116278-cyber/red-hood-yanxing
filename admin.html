<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小紅帽管理後台</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; }
        .header { background: #d32f2f; color: #fff; padding: 10px; text-align: center; border-radius: 10px; }
        .order-card { background: #fff; padding: 15px; margin-top: 10px; border-radius: 10px; position: relative; border-left: 8px solid #ddd; }
        .order-card.line { border-left-color: #00B900; }
        .order-card.cash { border-left-color: #666; }
        .order-no { position: absolute; right: 15px; top: 15px; font-size: 1.5rem; font-weight: bold; }
        .item-text { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; color: white; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 5px; margin-top: 10px; }
        .s-btn { padding: 8px; font-size: 0.7rem; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
        .s-btn.off { background: #ffcdd2; color: #d32f2f; }
        .s-btn.on { background: #c8e6c9; color: #2e7d32; }
    </style>
</head>
<body onclick="initAudio()">

<div class="header"><h2>小紅帽 訂單看板</h2></div>
<div id="audio-tip" style="background:#ffeb3b;text-align:center;padding:5px;margin:5px 0;border-radius:5px;">⚠️ 點我啟動語音提醒</div>

<div id="list">讀取中...</div>

<div style="background:#222;color:#fff;padding:15px;border-radius:10px;margin-top:15px;">
    今日總營收：$<span id="total-rev">0</span>
</div>

<div style="background:#fff;padding:15px;border-radius:10px;margin-top:15px;border:2px solid #d32f2f;">
    <h3 style="margin-top:0;">🌟 限定口味控制</h3>
    名稱：<input type="text" id="ltd-n" style="width:100%;padding:8px;box-sizing:border-box;"><br>
    價格：<input type="number" id="ltd-p" style="width:100%;padding:8px;box-sizing:border-box;margin-top:5px;">
    <button onclick="saveLtd()" style="width:100%;padding:10px;margin-top:10px;background:#d32f2f;color:#fff;border:none;border-radius:5px;font-weight:bold;">更新限定口味</button>
</div>

<div style="background:#fff;padding:15px;border-radius:10px;margin-top:15px;">
    <h3 style="margin-top:0;">🚫 售完管理</h3>
    <div id="stock-ctrl" class="stock-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioReady = false; let isFirst = true;
    window.initAudio = () => { if(!audioReady){ new SpeechSynthesisUtterance(""); audioReady=true; document.getElementById('audio-tip').innerText="✅ 語音已就緒"; document.getElementById('audio-tip').style.background="#c8e6c9"; }};

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snap) => {
        if (!isFirst && snap.docChanges().some(c => c.type === "added")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("有訂單喔")); }
        isFirst = false;
        const list = document.getElementById('list'); let rev = 0; list.innerHTML = "";
        snap.forEach(d => {
            const o = d.data(); const isL = o.payMethod === 'Line Pay'; if(o.status!=="已完成") rev += Number(o.total.replace('$',''));
            const div = document.createElement('div'); div.className = `order-card ${isL?'line':'cash'}`;
            div.innerHTML = `<div class="order-no">#${o.orderNo}</div><div style="font-size:0.8rem;color:#888;">${o.time}</div><div class="tag" style="background:${isL?'#00B900':'#666'}">${isL?'📱 LINE Pay':'💰 現場現金'}</div><div class="item-text">${o.items}</div><div style="display:flex;justify-content:space-between;align-items:center;"><b style="color:#d32f2f;font-size:1.2rem;">${o.total}</b><div><button onclick="updateDoc(doc(db,'orders','${d.id}'),{status:'已完成'})" style="background:#2ecc71;color:#fff;border:none;padding:5px 10px;border-radius:5px;">完成</button><button onclick="deleteDoc(doc(db,'orders','${d.id}'))" style="margin-left:5px;border:none;padding:5px;">刪除</button></div></div>`;
            list.appendChild(div);
        });
        document.getElementById('total-rev').innerText = rev;
    });

    const all = ["古早原味","爆漿奶油","熔岩巧克力","肉鬆沙拉","黃金起司","玉米起司","鮪魚起司","半月OREO","蛋黃奶酥","奶油+巧克力","奶油+肉鬆","肉鬆+巧克力","起司+玉米","起司+鮪魚","玉米+鮪魚","OREO+奶酥"];
    onSnapshot(doc(db, "settings", "menuStatus"), s => {
        const sold = s.exists() ? s.data().soldOut || [] : [];
        document.getElementById('stock-ctrl').innerHTML = all.map(n => `<button class="s-btn ${sold.includes(n)?'off':'on'}" onclick="toggle('${n}',${sold.includes(n)})">${n}</button>`).join('');
        window.curSold = sold;
    });

    window.toggle = async (n, isOff) => {
        let newList = isOff ? window.curSold.filter(i=>i!==n) : [...window.curSold, n];
        await setDoc(doc(db, "settings", "menuStatus"), { soldOut: newList });
    };

    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ document.getElementById('ltd-n').value=s.data().name; document.getElementById('ltd-p').value=s.data().price; }});
    window.saveLtd = async () => { await setDoc(doc(db, "settings", "limitedEdition"), { name: document.getElementById('ltd-n').value, price: Number(document.getElementById('ltd-p').value) }); alert("已更新！"); };
</script>
</body>
</html>
