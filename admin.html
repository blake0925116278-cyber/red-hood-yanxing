<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - 紅色警示版</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f0f0; padding: 10px; margin: 0; color: #333; }
        .header { background: #333; color: #fff; padding: 10px; text-align: center; border-radius: 0 0 15px 15px; }
        
        .dashboard { background: #fff; margin: 10px 5px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #FBC02D; }
        .stat-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .stat-card { text-align: left; flex: 1; }
        .stat-card span { font-size: 0.8rem; color: #666; }
        .stat-card b { font-size: 1.2rem; color: #d32f2f; display: block; margin-top: 4px; }
        
        #store-toggle-btn { padding: 8px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.85rem; width: 100%; cursor: pointer; margin-top: 5px; }
        .btn-clear { background: #d32f2f; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; cursor: pointer; white-space: nowrap; }

        /* 訂單卡片 */
        .order-card { background: #d32f2f; color: #fff; padding: 15px; margin-top: 12px; border-radius: 12px; position: relative; box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3); }
        .order-card.confirmed { background: #e67e22; } 
        .order-card.finished { background: #ffffff; color: #888; box-shadow: none; opacity: 0.6; border: 1px solid #ddd; }

        .order-no-badge { position: absolute; right: 10px; top: 10px; background: rgba(255,255,255,0.2); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; border: 1px solid #fff; }
        .finished .order-no-badge { background: #eee; color: #666; border-color: #ccc; }
        
        .item-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 1.1rem; }
        .finished .item-row { border-bottom-color: #eee; }
        
        .note-box { background: #ffeb3b; color: #333; padding: 8px; border-radius: 8px; margin-top: 10px; font-weight: bold; border-left: 5px solid #333; font-size: 1rem; }

        /* 按鈕組 */
        .btn-action { border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-full { width: 100%; margin-top: 12px; }
        .btn-confirm { background: #fff; color: #d32f2f; }
        .btn-finish { background: #333; color: #fff; flex: 3; }
        .btn-cancel { background: rgba(255,255,255,0.3); color: #fff; flex: 1; font-size: 0.9rem; border: 1px solid #fff; margin-left: 8px; }

        .admin-section { background: #fff; padding: 10px; border-radius: 10px; margin: 15px 5px; font-size: 0.85rem; border: 1px solid #ddd; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 5px; }
        .s-btn { padding: 8px 2px; font-size: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; }
        .s-btn.off { background: #ffebee; color: #d32f2f; }
        .s-btn.on { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body onclick="initAudio()">

<div class="header">
    <h3 style="margin:0;">小紅帽 訂單管理</h3>
    <button onclick="initAudio()" id="audio-tip" style="background:#ffeb3b; border:none; padding:4px 10px; border-radius:15px; margin-top:5px; font-size:0.75rem; font-weight:bold;">🔔 語音開啟</button>
</div>

<div class="dashboard">
    <div class="stat-row">
        <div class="stat-card"><span>今日營收</span><b id="total-rev">$0</b></div>
        <div class="stat-card"><span>總份數</span><b id="total-qty">0 份</b></div>
        <div class="stat-card">
            <span>營業狀態</span>
            <button id="store-toggle-btn" onclick="toggleStore()">載入中...</button>
        </div>
        <button class="btn-clear" onclick="clearAllOrders()">🧹 開店歸零</button>
    </div>
</div>

<div id="list" style="padding:0 5px;"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioReady = false; let isFirst = true; let isStoreOpen = true;
    window.initAudio = () => { if(!audioReady){ window.speechSynthesis.speak(new SpeechSynthesisUtterance("系統啟動")); audioReady=true; document.getElementById('audio-tip').innerText="✅ 語音已開"; }};

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "asc")), (snap) => {
        if (!isFirst && snap.docChanges().some(c => c.type === "added")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("新訂單")); }
        isFirst = false;
        const list = document.getElementById('list');
        let rev = 0; let totalQty = 0;
        list.innerHTML = "";
        
        snap.forEach(d => {
            const o = d.data();
            rev += parseInt(o.total.replace(/[^0-9]/g, "")) || 0;
            const itemsArr = o.items.split(', ');
            itemsArr.forEach(str => { totalQty += parseInt(str.split('x')[1]) || 1; });

            const status = o.status;
            const itemsHtml = itemsArr.map(str => `<div class="item-row"><span>${str.split('x')[0]}</span><b>x${str.split('x')[1]||1}</b></div>`).join('');

            const div = document.createElement('div');
            div.className = `order-card ${status}`;
            div.innerHTML = `
                <div class="order-no-badge">#${o.orderNo}</div>
                <div style="font-size:0.85rem; opacity:0.8;">${o.time}</div>
                <div style="margin:10px 0;">${itemsHtml}</div>
                ${o.note && o.note !== "無" ? `<div class="note-box">備註：${o.note}</div>` : ''}
                
                <div style="margin-top:12px;">
                    <b style="font-size:1.4rem;">${o.total}</b>
                    
                    ${status === 'pending' ? `
                        <button class="btn-action btn-full btn-confirm" onclick="updateStatus('${d.id}', 'confirmed')">確認接單</button>
                    ` : ''}
                    
                    ${status === 'confirmed' ? `
                        <div style="display:flex; margin-top:10px;">
                            <button class="btn-action btn-finish" onclick="updateStatus('${d.id}', 'finished')">完成出餐</button>
                            <button class="btn-action btn-cancel" onclick="updateStatus('${d.id}', 'pending')">取消</button>
                        </div>
                    ` : ''}
                    
                    ${status === 'finished' ? `
                        <div style="text-align:right; margin-top:10px;"><b style="color:#aaa;">✓ 已完成</b></div>
                    ` : ''}
                </div>`;
            list.appendChild(div);
        });
        document.getElementById('total-rev').innerText = `$${rev}`;
        document.getElementById('total-qty').innerText = `${totalQty} 份`;
    });

    // 其餘邏輯 (營業開關、庫存管理、歸零) 保持不變...
    onSnapshot(doc(db, "settings", "storeStatus"), s => {
        isStoreOpen = s.exists() ? s.data().isOpen : true;
        const btn = document.getElementById('store-toggle-btn');
        btn.innerText = isStoreOpen ? "🟢 營業中" : "🔴 休息中";
        btn.style.background = isStoreOpen ? "#e8f5e9" : "#ffebee";
        btn.style.color = isStoreOpen ? "#2e7d32" : "#d32f2f";
    });
    window.toggleStore = async () => { await setDoc(doc(db, "settings", "storeStatus"), { isOpen: !isStoreOpen }); };
    window.updateStatus = async (id, s) => { await updateDoc(doc(db, 'orders', id), { status: s }); };
    window.clearAllOrders = async () => { if(confirm("確定要歸零嗎？")){ const q = await getDocs(collection(db, "orders")); const b = writeBatch(db); q.forEach(d=>b.delete(d.ref)); await b.commit(); }};
    const baseItems = ["古早原味","爆漿奶油","熔岩巧克力","肉鬆沙拉","黃金起司","玉米起司","鮪魚起司","半月OREO","蛋黃奶酥"];
    let curLtd = "";
    function updateStockUI(sList) {
        let all = [...baseItems]; if(curLtd) all.push(curLtd);
        document.getElementById('stock-ctrl').innerHTML = all.map(n => `<button class="s-btn ${sList.includes(n)?'off':'on'}" onclick="toggleSold('${n}',${sList.includes(n)})">${n}</button>`).join('');
        window.curSold = sList;
    }
    onSnapshot(doc(db, "settings", "menuStatus"), s => updateStockUI(s.exists() ? s.data().soldOut || [] : []));
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ curLtd = s.data().name; getDoc(doc(db, "settings", "menuStatus")).then(ss => updateStockUI(ss.exists() ? ss.data().soldOut || [] : [])); }});
    window.toggleSold = async (n, isS) => { await setDoc(doc(db, "settings", "menuStatus"), { soldOut: isS ? window.curSold.filter(i=>i!==n) : [...window.curSold, n] }); };
    window.saveLtd = async () => { await setDoc(doc(db, "settings", "limitedEdition"), { name: document.getElementById('ltd-n').value, price: Number(document.getElementById('ltd-p').value) }); alert("OK"); };
</script>
</body>
</html>
