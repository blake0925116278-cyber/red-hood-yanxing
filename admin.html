<div class="dashboard">
    <div class="stat-row">
        <div class="stat-card"><span>今日營收</span><b id="total-rev">$0</b></div>
        <div class="stat-card"><span>今日總份數</span><b id="total-qty">0 份</b></div>
        <div class="stat-card">
            <span>營業狀態</span>
            <button id="store-toggle-btn" onclick="toggleStore()" style="padding:8px 12px; border-radius:8px; border:none; font-weight:bold; cursor:pointer; margin-top:5px;">載入中...</button>
        </div>
        <button class="btn-clear" onclick="clearAllOrders()">🧹 開店歸零</button>
    </div>
</div>

<script type="module">
    // ... 前方初始化與 Firebase 設定保持不變 ...
    let isStoreOpen = true;

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "asc")), (snap) => {
        let rev = 0; let totalQty = 0;
        const list = document.getElementById('list');
        list.innerHTML = "";
        
        snap.forEach(d => {
            const o = d.data();
            rev += parseInt(o.total.replace(/[^0-9]/g, "")) || 0;

            // 統計總份數：將 items 字串拆解並累加數量部分
            // 例如 "原味x2, 起司x1" -> 2 + 1 = 3 份
            const itemSegments = o.items.split(', ');
            itemSegments.forEach(seg => {
                const count = parseInt(seg.split('x')[1]) || 1;
                totalQty += count;
            });

            // ... 訂單卡片渲染邏輯 (含備註顯示) 保持不變 ...
            const status = o.status;
            const itemsHtml = o.items.split(', ').map(str => {
                const parts = str.split('x');
                return `<div class="item-row"><span>${parts[0]}</span><b>x${parts[1]||1}</b></div>`;
            }).join('');

            const div = document.createElement('div');
            div.className = `order-card ${status === 'finished' ? 'finished' : (status === 'confirmed' ? 'confirmed' : '')}`;
            div.innerHTML = `
                <div class="order-no-badge">#${o.orderNo}</div>
                <div style="font-size:0.85rem; opacity:0.8;">${o.time}</div>
                <div style="margin:10px 0;">${itemsHtml}</div>
                ${o.note && o.note !== "無" ? `<div class="note-box">備註：${o.note}</div>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                    <b style="font-size:1.4rem;">${o.total}</b>
                    <div style="width:60%">
                        ${status === 'pending' ? `<button class="btn-action btn-confirm" onclick="updateStatus('${d.id}', 'confirmed')">確認接單</button>` : ''}
                        ${status === 'confirmed' ? `<button class="btn-action btn-finish" onclick="updateStatus('${d.id}', 'finished')">完成出餐</button>` : ''}
                        ${status === 'finished' ? '<b style="color:#aaa;">✓ 已完成</b>' : ''}
                    </div>
                </div>`;
            list.appendChild(div);
        });

        document.getElementById('total-rev').innerText = `$${rev}`;
        document.getElementById('total-qty').innerText = `${totalQty} 份`;
    });

    // --- 營業狀態控制 ---
    onSnapshot(doc(db, "settings", "storeStatus"), s => {
        isStoreOpen = s.exists() ? s.data().isOpen : true;
        const btn = document.getElementById('store-toggle-btn');
        btn.innerText = isStoreOpen ? "🟢 營業中" : "🔴 休息中";
        btn.style.background = isStoreOpen ? "#e8f5e9" : "#ffebee";
        btn.style.color = isStoreOpen ? "#2e7d32" : "#d32f2f";
    });

    window.toggleStore = async () => {
        await setDoc(doc(db, "settings", "storeStatus"), { isOpen: !isStoreOpen });
    };

    window.updateStatus = async (id, s) => { await updateDoc(doc(db, 'orders', id), { status: s }); };
    // ... 其餘庫存管理與歸零代碼 ...
</script>
