<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - 統計與保留模式</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f6; padding: 10px; margin: 0; color: #333; }
        .header { background: #d32f2f; color: #fff; padding: 10px; text-align: center; border-radius: 0 0 15px 15px; }
        
        /* 統計面板 */
        .dashboard { background: #fff; margin: 10px 5px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #FBC02D; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stat-card { text-align: center; flex: 1; }
        .stat-card b { font-size: 1.4rem; color: #d32f2f; }
        .item-summary { font-size: 0.85rem; color: #666; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-top: 1px solid #eee; padding-top: 10px; }

        /* 訂單卡片 */
        .order-card { background: #fff; padding: 12px; margin-top: 10px; border-radius: 10px; position: relative; border-left: 8px solid #ddd; transition: 0.3s; }
        .order-card.line { border-left-color: #00B900; }
        .order-card.cash { border-left-color: #666; }
        .order-card.finished { opacity: 0.5; background: #f9f9f9; border-left-color: #ccc; } /* 已完成但未清空的樣式 */
        
        .order-no-badge { position: absolute; right: 10px; top: 10px; background: #333; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 1.2rem; font-weight: bold; }
        
        .item-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #f0f0f0; font-size: 1.1rem; }
        .mix-info { font-size: 0.85rem; color: #e65100; display: block; }
        
        .btn-done { border: none; padding: 8px 15px; border-radius: 6px; background: #2e7d32; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-done.is-finished { background: #bbb; cursor: default; }

        /* 底部控制區縮小 */
        .admin-section { background: #fff; padding: 10px; border-radius: 10px; margin: 10px 5px; font-size: 0.85rem; border: 1px solid #ddd; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 5px; }
        .s-btn { padding: 6px 2px; font-size: 0.75rem; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .s-btn.off { background: #ffebee; color: #d32f2f; }
        .s-btn.on { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body onclick="initAudio()">

<div class="header">
    <h3 style="margin:0;">小紅帽 訂單看板</h3>
    <button onclick="initAudio()" id="audio-tip" style="background:#ffeb3b; border:none; padding:4px 10px; border-radius:15px; margin-top:5px; font-size:0.75rem; font-weight:bold;">🔔 語音提醒</button>
</div>

<div class="dashboard">
    <div class="stat-row">
        <div class="stat-card">今日營收<br><b id="total-rev">$0</b></div>
        <div class="stat-card">總訂單數<br><b id="total-orders">0</b></div>
        <button onclick="clearAllOrders()" style="background:#444; color:#fff; border:none; border-radius:5px; padding:5px 10px; font-size:0.8rem;">🧹 開店歸零</button>
    </div>
    <div id="item-stats" class="item-summary">
        </div>
</div>

<div id="list" style="padding:0 5px;"></div>

<div class="admin-section" style="border-color:#d32f2f">
    <div style="display:flex; align-items:center; gap:5px;">
        <b>限定:</b>
        <input type="text" id="ltd-n" placeholder="名稱" style="width:70px; padding:4px;">
        <input type="number" id="ltd-p" placeholder="價" style="width:40px; padding:4px;">
        <button onclick="saveLtd()" style="background:#d32f2f; color:#fff; border:none; padding:4px 8px; border-radius:4px;">存</button>
    </div>
</div>

<div class="admin-section">
    <div id="stock-ctrl" class="stock-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioReady = false; let isFirst = true;
    window.initAudio = () => { if(!audioReady){ window.speechSynthesis.speak(new SpeechSynthesisUtterance("OK")); audioReady=true; document.getElementById('audio-tip').innerText="✅ 已開啟"; }};

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "asc")), (snap) => {
        if (!isFirst && snap.docChanges().some(c => c.type === "added")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("新訂單")); }
        isFirst = false;
        
        const list = document.getElementById('list');
        let rev = 0; let totalCount = 0; let itemCounts = {};
        list.innerHTML = "";
        
        snap.forEach(d => {
            const o = d.data();
            const totalVal = parseInt(o.total.replace(/[^0-9]/g, "")) || 0;
            rev += totalVal;
            totalCount++;

            // 統計各口味份數
            const itemsArray = o.items.split(', ');
            itemsArray.forEach(str => {
                const parts = str.split('x');
                const name = parts[0];
                const q = parseInt(parts[1]) || 1;
                itemCounts[name] = (itemCounts[name] || 0) + q;
            });

            // 渲染卡片
            const isF = o.status === "finished";
            const itemsHtml = itemsArray.map(str => {
                const parts = str.split('x');
                return `<div class="item-row"><span>${parts[0]}</span><b>x${parts[1]||1}</b></div>`;
            }).join('');

            const div = document.createElement('div');
            div.className = `order-card ${o.payMethod==='Line Pay'?'line':'cash'} ${isF?'finished':''}`;
            div.innerHTML = `
                <div class="order-no-badge">#${o.orderNo}</div>
                <div style="font-size:0.8rem; color:#888;">${o.time} | ${o.payMethod}</div>
                <div style="margin:10px 0;">${itemsHtml}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b style="font-size:1.2rem; color:#d32f2f;">${o.total}</b>
                    ${isF ? '<span style="color:#888; font-weight:bold;">已完成</span>' : `<button class="btn-done" onclick="markDone('${d.id}')">完成出餐</button>`}
                </div>`;
            list.appendChild(div);
        });

        // 更新統計顯示
        document.getElementById('total-rev').innerText = `$${rev}`;
        document.getElementById('total-orders').innerText = totalCount;
        
        let statsHtml = "";
        Object.entries(itemCounts).forEach(([name, count]) => {
            statsHtml += `<div>${name.replace('[超值]','').replace('[自由]','')}: <b>${count} 份</b></div>`;
        });
        document.getElementById('item-stats').innerHTML = statsHtml;
    });

    window.markDone = async (id) => { await updateDoc(doc(db, 'orders', id), { status: "finished" }); };

    window.clearAllOrders = async () => {
        if(confirm("確定要執行「開店歸零」嗎？這會清除所有歷史紀錄並從 1 號開始。")) {
            const q = await getDocs(collection(db, "orders"));
            const batch = writeBatch(db);
            q.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    // 供應管理 (縮小版)
    const baseItems = ["古早原味","爆漿奶油","熔岩巧克力","肉鬆沙拉","黃金起司","玉米起司","鮪魚起司","半月OREO","蛋黃奶酥"];
    let curLtd = "";
    function updateStockUI(sList) {
        let all = [...baseItems]; if(curLtd) all.push(curLtd);
        document.getElementById('stock-ctrl').innerHTML = all.map(n => `<button class="s-btn ${sList.includes(n)?'off':'on'}" onclick="toggleSold('${n}',${sList.includes(n)})">${n}</button>`).join('');
        window.curSold = sList;
    }
    onSnapshot(doc(db, "settings", "menuStatus"), s => updateStockUI(s.exists() ? s.data().soldOut || [] : []));
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ curLtd = s.data().name; getDoc(doc(db, "settings", "menuStatus")).then(ss => updateStockUI(ss.exists() ? ss.data().soldOut || [] : [])); }});
    window.toggleSold = async (n, isS) => { await setDoc(doc(db, "settings", "menuStatus"), { soldOut: isS ? window.curSold.filter(i=>i!==n) : [...window.curSold, n] }); };
    window.saveLtd = async () => { await setDoc(doc(db, "settings", "limitedEdition"), { name: document.getElementById('ltd-n').value, price: Number(document.getElementById('ltd-p').value) }); alert("OK"); };
</script>
</body>
</html>
