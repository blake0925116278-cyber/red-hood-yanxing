<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小紅帽後台管理</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; padding-bottom: 140px; }
        .header { background: #d32f2f; color: white; padding: 15px; text-align: center; border-radius: 10px; margin-bottom: 20px; }
        .order-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 8px solid #fbc02d; position: relative; }
        .order-card.completed { border-left-color: #bdc3c7; opacity: 0.6; background: #f9f9f9; }
        
        /* 顯示序號的樣式 */
        .order-badge { position: absolute; right: 15px; top: 15px; background: #333; color: #fff; padding: 5px 12px; border-radius: 20px; font-weight: 900; font-size: 1.2rem; }
        
        .order-header { display: flex; flex-direction: column; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; }
        .order-time { color: #666; font-size: 0.85rem; }
        .order-items { font-size: 1.1rem; font-weight: bold; color: #333; margin-bottom: 10px; width: 80%; }
        
        .order-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .order-total { color: #d32f2f; font-size: 1.2rem; font-weight: bold; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-done { background: #2ecc71; color: white; }
        .btn-cancel { background: #ecf0f1; color: #95a5a6; }

        .footer-summary { position: fixed; bottom: 0; left: 0; width: 100%; background: #222; color: white; padding: 15px 25px; box-sizing: border-box; display: flex; flex-direction: column; gap: 5px; z-index: 1000; border-radius: 15px 15px 0 0; }
        .summary-row { display: flex; justify-content: space-between; }
        .val-qty { color: #5dade2; font-size: 1.4rem; font-weight: 900; }
        .val-amount { color: #fbc02d; font-size: 1.8rem; font-weight: 900; }
    </style>
</head>
<body>

<div class="header"><h1>今日訂單看板</h1></div>
<div id="order-list">讀取中...</div>

<div class="footer-summary">
    <div class="summary-row"><span>今日總份數</span><span class="val-qty"><span id="daily-qty">0</span> 份</span></div>
    <div class="summary-row"><span>今日總營收</span><span class="val-amount">$<span id="daily-total">0</span></span></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc",
        authDomain: "myordersystem-dee08.firebaseapp.com",
        projectId: "myordersystem-dee08",
        storageBucket: "myordersystem-dee08.firebasestorage.app",
        messagingSenderId: "775750661450",
        appId: "1:775750661450:web:e56f00456f0285c8bebdb3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "orders"), orderBy("timestamp", "desc"));
    
    onSnapshot(q, (snapshot) => {
        const orderList = document.getElementById('order-list');
        let totalAmount = 0, totalQty = 0;
        orderList.innerHTML = "";

        snapshot.forEach((orderDoc) => {
            const data = orderDoc.data();
            const isDone = data.status === "已完成";
            
            let orderQty = 0;
            if (data.items) {
                const matches = data.items.match(/x\s*(\d+)/g);
                if (matches) matches.forEach(m => orderQty += parseInt(m.replace('x', '').trim()));
            }
            
            totalAmount += (Number(data.total) || 0);
            totalQty += orderQty;

            const div = document.createElement('div');
            div.className = `order-card ${isDone ? 'completed' : ''}`;
            div.innerHTML = `
                <div class="order-badge">#${data.orderNo || '?'}</div>
                <div class="order-header">
                    <span class="order-time">${data.time || '--'}</span>
                    <span style="font-size:0.8rem; color:${isDone ? '#999' : '#e67e22'}">${data.status}</span>
                </div>
                <div class="order-items">${data.items}</div>
                <div class="order-footer">
                    <div class="order-total">$${data.total || 0} <small>(${orderQty}份)</small></div>
                    <div class="btn-group">
                        ${!isDone ? `<button class="btn btn-done" onclick="updateStatus('${orderDoc.id}', '已完成')">完成</button>` : ''}
                        <button class="btn btn-cancel" onclick="cancelOrder('${orderDoc.id}')">取消</button>
                    </div>
                </div>
            `;
            orderList.appendChild(div);
        });
        document.getElementById('daily-total').innerText = totalAmount;
        document.getElementById('daily-qty').innerText = totalQty;
    });

    window.updateStatus = async (id, s) => await updateDoc(doc(db, "orders", id), { status: s });
    window.cancelOrder = async (id) => { if(confirm("確定取消？")) await deleteDoc(doc(db, "orders", id)); };
</script>
</body>
</html>
