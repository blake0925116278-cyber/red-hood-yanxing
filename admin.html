<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理後台 - 紅色警示版</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f0f0f0; padding: 10px; margin: 0; color: #333; }
        .header { background: #333; color: #fff; padding: 10px; text-align: center; border-radius: 0 0 15px 15px; }
        
        .dashboard { background: #fff; margin: 10px 5px; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-top: 5px solid #FBC02D; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; }
        .stat-card { text-align: left; flex: 1; }
        .stat-card span { font-size: 0.85rem; color: #666; }
        .stat-card b { font-size: 1.5rem; color: #d32f2f; display: block; }
        .btn-clear { background: #d32f2f; color: #fff; border: none; border-radius: 8px; padding: 10px 15px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }

        /* --- 訂單卡片核心樣式 --- */
        .order-card { 
            background: #d32f2f; /* 預設紅色 (待製作) */
            color: #fff;        /* 待製作時文字白色 */
            padding: 12px; 
            margin-top: 12px; 
            border-radius: 12px; 
            position: relative; 
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
            transition: all 0.3s ease;
        }
        
        /* 完成後反白樣式 */
        .order-card.finished { 
            background: #ffffff; /* 反白 */
            color: #888;        /* 文字變淡 */
            box-shadow: none;
            opacity: 0.6;
            border: 1px solid #ddd;
        }

        .order-no-badge { 
            position: absolute; right: 10px; top: 10px; 
            background: rgba(255,255,255,0.2); 
            color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 1.4rem; font-weight: 900; 
            border: 1px solid #fff;
        }
        .finished .order-no-badge { 
            background: #eee; color: #666; border-color: #ccc; 
        }
        
        .item-row { 
            display: flex; justify-content: space-between; 
            padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.2); font-size: 1.15rem; 
        }
        .finished .item-row { border-bottom-color: #eee; }
        
        .btn-done { 
            border: none; padding: 10px 20px; border-radius: 8px; 
            background: #fff; color: #d32f2f; /* 紅底白鈕 */
            font-weight: bold; cursor: pointer; font-size: 1.1rem; width: 100%; margin-top: 10px;
        }

        /* 底部控制區 */
        .admin-section { background: #fff; padding: 10px; border-radius: 10px; margin: 10px 5px; font-size: 0.85rem; border: 1px solid #ddd; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 5px; }
        .s-btn { padding: 8px 2px; font-size: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; }
        .s-btn.off { background: #ffebee; color: #d32f2f; }
        .s-btn.on { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body onclick="initAudio()">

<div class="header">
    <h3 style="margin:0;">小紅帽 訂單管理</h3>
    <button onclick="initAudio()" id="audio-tip" style="background:#ffeb3b; border:none; padding:4px 10px; border-radius:15px; margin-top:5px; font-size:0.75rem; font-weight:bold;">🔔 語音開啟</button>
</div>

<div class="dashboard">
    <div class="stat-row">
        <div class="stat-card"><span>今日累計營收</span><b id="total-rev">$0</b></div>
        <div class="stat-card"><span>總訂單數</span><b id="total-orders">0</b></div>
        <button class="btn-clear" onclick="clearAllOrders()">🧹 開店歸零</button>
    </div>
</div>

<div id="list" style="padding:0 5px;"></div>

<div class="admin-section" style="border-color:#d32f2f">
    <div style="display:flex; align-items:center; gap:5px;">
        <b>限定口味:</b>
        <input type="text" id="ltd-n" placeholder="名稱" style="width:80px; padding:6px; border:1px solid #ddd; border-radius:4px;">
        <input type="number" id="ltd-p" placeholder="價" style="width:45px; padding:6px; border:1px solid #ddd; border-radius:4px;">
        <button onclick="saveLtd()" style="background:#d32f2f; color:#fff; border:none; padding:6px 12px; border-radius:4px; font-weight:bold;">存</button>
    </div>
</div>

<div class="admin-section">
    <div id="stock-ctrl" class="stock-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, setDoc, getDoc, getDocs, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let audioReady = false; let isFirst = true;
    window.initAudio = () => { if(!audioReady){ window.speechSynthesis.speak(new SpeechSynthesisUtterance("系統啟動")); audioReady=true; document.getElementById('audio-tip').innerText="✅ 語音已開"; }};

    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "asc")), (snap) => {
        if (!isFirst && snap.docChanges().some(c => c.type === "added")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("新訂單")); }
        isFirst = false;
        
        const list = document.getElementById('list');
        let rev = 0; let totalCount = 0;
        list.innerHTML = "";
        
        snap.forEach(d => {
            const o = d.data();
            rev += parseInt(o.total.replace(/[^0-9]/g, "")) || 0;
            totalCount++;

            const isF = o.status === "finished";
            const itemsHtml = o.items.split(', ').map(str => {
                const parts = str.split('x');
                return `<div class="item-row"><span>${parts[0]}</span><b>x${parts[1]||1}</b></div>`;
            }).join('');

            const div = document.createElement('div');
            div.className = `order-card ${isF ? 'finished' : ''}`;
            div.innerHTML = `
                <div class="order-no-badge">#${o.orderNo}</div>
                <div style="font-size:0.85rem; opacity:0.8;">${o.time} | ${o.payMethod}</div>
                <div style="margin:10px 0;">${itemsHtml}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <b style="font-size:1.4rem;">${o.total}</b>
                    ${isF ? '<b style="color:#aaa;">✓ 已完成</b>' : `<button class="btn-done" onclick="markDone('${d.id}')">完成出餐</button>`}
                </div>`;
            list.appendChild(div);
        });

        document.getElementById('total-rev').innerText = `$${rev}`;
        document.getElementById('total-orders').innerText = totalCount;
    });

    window.markDone = async (id) => { await updateDoc(doc(db, 'orders', id), { status: "finished" }); };

    window.clearAllOrders = async () => {
        if(confirm("確定要「開店歸零」嗎？\n畫面將會清空，下一張單會從 1 號重新排。")) {
            const q = await getDocs(collection(db, "orders"));
            const batch = writeBatch(db);
            q.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
    };

    // 口味管理邏輯
    const baseItems = ["古早原味","爆漿奶油","熔岩巧克力","肉鬆沙拉","黃金起司","玉米起司","鮪魚起司","半月OREO","蛋黃奶酥"];
    let curLtd = "";
    function updateStockUI(sList) {
        let all = [...baseItems]; if(curLtd) all.push(curLtd);
        document.getElementById('stock-ctrl').innerHTML = all.map(n => `<button class="s-btn ${sList.includes(n)?'off':'on'}" onclick="toggleSold('${n}',${sList.includes(n)})">${n}</button>`).join('');
        window.curSold = sList;
    }
    onSnapshot(doc(db, "settings", "menuStatus"), s => updateStockUI(s.exists() ? s.data().soldOut || [] : []));
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ curLtd = s.data().name; getDoc(doc(db, "settings", "menuStatus")).then(ss => updateStockUI(ss.exists() ? ss.data().soldOut || [] : [])); }});
    window.toggleSold = async (n, isS) => { await setDoc(doc(db, "settings", "menuStatus"), { soldOut: isS ? window.curSold.filter(i=>i!==n) : [...window.curSold, n] }); };
    window.saveLtd = async () => { await setDoc(doc(db, "settings", "limitedEdition"), { name: document.getElementById('ltd-n').value, price: Number(document.getElementById('ltd-p').value) }); alert("OK"); };
</script>
</body>
</html>
