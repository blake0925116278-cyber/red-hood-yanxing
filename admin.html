<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小紅帽後台管理</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 15px; padding-bottom: 140px; }
        .header { background: #d32f2f; color: white; padding: 12px; text-align: center; border-radius: 10px; }
        .btn-reset { background: #666; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; float: right; margin: 10px 0; }
        .order-card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 8px solid #fbc02d; position: relative; }
        .order-card.completed { border-left-color: #bdc3c7; opacity: 0.5; }
        .order-badge { position: absolute; right: 12px; top: 12px; background: #333; color: #fff; padding: 4px 10px; border-radius: 15px; font-weight: 900; }
        .order-items { font-size: 1.15rem; font-weight: bold; margin: 8px 0; padding-right: 45px; line-height: 1.5; }
        .footer-summary { position: fixed; bottom: 0; left: 0; width: 100%; background: #222; color: white; padding: 15px; box-sizing: border-box; border-radius: 15px 15px 0 0; }
        .stock-btn { padding: 8px; border: none; border-radius: 5px; font-size: 0.75rem; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>今日訂單看板</h1></div>
<button class="btn-reset" onclick="resetAllOrders()">🧹 開店清空</button>
<div id="order-list" style="clear:both;">讀取中...</div>

<div style="background:white; border-radius:15px; padding:15px; margin-bottom:20px;">
    <h4 style="margin:0 0 10px 0; color:#d32f2f;">🚫 品項供應開關 (點擊切換)</h4>
    <div id="stock-manager" style="display:flex; flex-wrap:wrap; gap:5px;"></div>
</div>

<div class="footer-summary">
    <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>今日份數</span><span style="color:#5dade2; font-weight:900;"><span id="daily-qty">0</span> 份</span></div>
    <div style="display:flex; justify-content:space-between;"><span>今日營收</span><span style="color:#fbc02d; font-size:1.5rem; font-weight:900;">$<span id="daily-total">0</span></span></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, getDocs, writeBatch, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc",
        authDomain: "myordersystem-dee08.firebaseapp.com",
        projectId: "myordersystem-dee08",
        storageBucket: "myordersystem-dee08.firebasestorage.app",
        messagingSenderId: "775750661450",
        appId: "1:775750661450:web:e56f00456f0285c8bebdb3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const allNames = ["古早原味", "爆漿奶油", "熔岩巧克力", "肉鬆沙拉", "黃金起司", "玉米起司", "鮪魚起司", "半月OREO", "蛋黃奶酥", "奶油 + 巧克力", "奶油 + 肉鬆", "肉鬆 + 巧克力", "起司 + 玉米", "起司 + 鮪魚", "玉米 + 鮪魚", "OREO + 奶酥"];

    // 監聽訂單
    onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc")), (snapshot) => {
        const orderList = document.getElementById('order-list');
        let totalAmount = 0, totalQty = 0;
        orderList.innerHTML = "";
        snapshot.forEach((orderDoc) => {
            const data = orderDoc.data();
            const isDone = data.status === "已完成";
            let qty = 0;
            const matches = (data.items || "").match(/x\s*(\d+)/g);
            if (matches) matches.forEach(m => qty += parseInt(m.replace('x', '')));
            totalAmount += (Number(data.total) || 0); totalQty += qty;

            const div = document.createElement('div');
            div.className = `order-card ${isDone ? 'completed' : ''}`;
            div.innerHTML = `<div class="order-badge">#${data.orderNo || '?'}</div><div style="font-size:0.8rem;color:#888;">${data.time}</div><div class="order-items">${data.items}</div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="color:#d32f2f; font-weight:bold;">$${data.total} <small>(${qty}份)</small></div>
                    <div>${!isDone ? `<button style="background:#2ecc71; color:white; border:none; padding:8px; border-radius:5px;" onclick="updateStatus('${orderDoc.id}', '已完成')">完成</button>` : ''}
                    <button style="background:#eee; border:none; padding:8px; border-radius:5px; color:#888;" onclick="cancelOrder('${orderDoc.id}')">取消</button></div>
                </div>`;
            orderList.appendChild(div);
        });
        document.getElementById('daily-total').innerText = totalAmount;
        document.getElementById('daily-qty').innerText = totalQty;
    });

    // 監聽停售管理
    onSnapshot(doc(db, "settings", "menuStatus"), (docSnap) => {
        const soldOut = docSnap.exists() ? docSnap.data().soldOut || [] : [];
        document.getElementById('stock-manager').innerHTML = allNames.map(name => {
            const isOff = soldOut.includes(name);
            return `<button class="stock-btn" onclick="toggleStock('${name}', ${isOff})" style="background:${isOff ? '#ffcdd2' : '#c8e6c9'}; color:${isOff ? '#d32f2f' : '#2e7d32'};">${name}</button>`;
        }).join('');
    });

    window.toggleStock = async (name, isOff) => {
        const snap = await getDocs(query(collection(db, "settings")));
        let list = [];
        document.querySelectorAll('.stock-btn').forEach(btn => { if(btn.style.background.includes('rgb(255, 205, 210)')) list.push(btn.innerText); });
        if(!isOff) list.push(name); else list = list.filter(i => i !== name);
        await setDoc(doc(db, "settings", "menuStatus"), { soldOut: list });
    };

    window.resetAllOrders = async () => { if(confirm("確定清空今天所有數據？")) { const q = await getDocs(collection(db, "orders")); const b = writeBatch(db); q.forEach(d => b.delete(d.ref)); await b.commit(); } };
    window.updateStatus = async (id, s) => await updateDoc(doc(db, "orders", id), { status: s });
    window.cancelOrder = async (id) => { if(confirm("確定取消？")) await deleteDoc(doc(db, "orders", id)); };
</script>
</body>
</html>
