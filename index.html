<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小紅帽雞蛋糕點餐</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: "PingFang TC", "Noto Sans TC", -apple-system, sans-serif; background: linear-gradient(180deg, #fff7dc 0%, #ffe7c4 55%, #fff1d6 100%); margin: 0; padding-bottom: 108px; color: #3a2418; }
        button { cursor: pointer; }
        .header { background: linear-gradient(180deg, #ef5350, #c62828); color: white; padding: 14px 0 12px; text-align: center; box-shadow: 0 6px 16px rgba(198,40,40,0.28); }
        .header h1 { margin: 0; font-size: 1.28rem; letter-spacing: 0.18em; font-weight: 800; }
        .category-title { background: linear-gradient(180deg, #ffe082, #f9a825); color: #5d3a00; display: inline-block; padding: 5px 14px; border-radius: 999px; font-weight: 800; margin: 14px 15px 8px; font-size: 0.85rem; box-shadow: 0 2px 0 rgba(183,110,0,0.18); }
        .menu-item { background: #fff; margin: 6px 15px; padding: 12px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: 0 3px 10px rgba(90,40,0,0.07); border: 1px solid rgba(251,192,45,0.35); }
        .item-info b { font-size: 1.05rem; }
        .item-info span { color: #c62828; font-weight: 800; margin-left: 6px; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .btn-qty { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #f0b429; background: #fffdf6; font-size: 1.15rem; display: flex; align-items: center; justify-content: center; color: #c62828; font-weight: 700; }
        .add-cart-btn, .mix-add { width: 100%; padding: 11px; background: linear-gradient(180deg, #ffd54f, #f9a825); border: none; border-radius: 12px; font-weight: 800; font-size: 0.95rem; color: #5d3a00; box-shadow: 0 3px 0 #e69500; }
        .mix-add-red { background: linear-gradient(180deg, #ef5350, #c62828); color: #fff; box-shadow: 0 3px 0 #8e0000; }
        .mix-box { background: #fff; margin: 6px 15px; padding: 12px; border-radius: 14px; border: 1.5px solid #f0b429; box-shadow: 0 3px 10px rgba(90,40,0,0.06); }
        select { width: 100%; padding: 10px; border-radius: 10px; margin: 4px 0 8px; background: #fffdf6; border: 1.5px solid #f0d48a; font-size: 0.95rem; -webkit-appearance: none; }
        #mix-preview-text, #free-mix-preview { margin: 5px 0 8px; padding: 8px; background: #fff8e1; border: 1px dashed #f0b429; border-radius: 10px; font-size: 0.85rem; color: #5d3a00; text-align: center; }
        .cart-row { display: flex; justify-content: space-between; background: #fff8e8; padding: 11px 12px; border-radius: 12px; margin-bottom: 6px; border: 1.5px solid #f0b429; }
        .cart-empty { color: #888; font-weight: 600; }
        .cart-bar { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.96); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(90,40,0,0.12); display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 200; border-top: 3px solid #c62828; }
        .btn-cart { background: linear-gradient(180deg, #ffd54f, #f9a825); color: #5d3a00; padding: 10px 16px; border-radius: 999px; border: none; font-weight: 800; font-size: 1rem; box-shadow: 0 3px 0 #e69500; white-space: nowrap; }
        .btn-submit { background: linear-gradient(180deg, #ef5350, #c62828); color: white; padding: 10px 20px; border-radius: 999px; border: none; font-weight: 800; font-size: 1rem; box-shadow: 0 3px 0 #8e0000; white-space: nowrap; }
        #cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 8000; justify-content: center; align-items: center; padding: 20px; }
        .cart-panel { background: #fffdf6; width: 100%; max-width: 400px; border-radius: 18px; padding: 18px 16px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 28px rgba(90,40,0,0.2); }
        .cart-panel h3 { margin: 0 0 12px; color: #c62828; text-align: center; }
        
        /* 彈窗與工單樣式維持不變 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 10000; }
        #pickup-chip { display: none; position: relative; z-index: 10001; background: linear-gradient(180deg, #ef5350, #c62828); color: #fff; margin: 10px 15px 0; padding: 12px; border-radius: 14px; font-weight: 800; text-align: center; box-shadow: 0 6px 16px rgba(198,40,40,0.35); cursor: pointer; border: 2px solid #ffcdd2; }
        .overlay.pickup-mode { background: rgba(80, 0, 0, 0.78); }
        .overlay.pickup-mode .ticket { background: #fff5f5; color: #7f0000; border: 3px solid #e53935; }
        .overlay.pickup-mode .order-num { color: #c62828; border-color: #e53935; background: #ffcdd2; }
        .overlay.pickup-mode .ready-time { color: #c62828; }
        .overlay.pickup-mode h2 { color: #c62828 !important; }
        .pickup-btn-main { background: #e53935 !important; color: #fff !important; }
        .pickup-btn-sub { background: #8e0000 !important; color: #fff !important; }
        .pickup-btn-cancel { background: #5d4037 !important; color: #fff !important; }
        .ticket { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; text-align: center; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .order-num { font-size: 4rem; font-weight: 900; margin: 15px 0; color: #d32f2f; border: 4px solid #d32f2f; display: inline-block; padding: 0 25px; border-radius: 15px; }
        .detail-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.95rem; text-align: left; }
        .detail-table th { border-bottom: 2px solid #eee; padding: 8px; color: #666; }
        .detail-table td { padding: 8px; border-bottom: 1px solid #eee; }
        .note-input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #eee; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .pay-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; margin-bottom: 8px; font-size: 1.1rem; cursor: pointer; }
        .ready-time { font-size: 1.4rem; font-weight: 800; color: #d32f2f; margin: 8px 0; }
        .pulse { animation: pulse-animation 2s infinite; }
        @keyframes pulse-animation { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        #closed-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(211,47,47,0.98); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div id="closed-overlay">
    <h1 id="store-overlay-icon" style="font-size:3rem; margin:0;">🌙</h1>
    <h2 id="store-overlay-title" style="font-size:1.5rem; margin:10px 0;">老闆休息囉！</h2>
    <p id="store-overlay-msg">目前非營業時間，暫時無法點餐。</p>
</div>

<div class="header"><h1>小紅帽雞蛋糕</h1></div>
<div id="pickup-chip" onclick="reopenPickup()">查看取餐資訊</div>

<div class="category-title">單一口味 (5顆)</div>
<div id="single-list"></div>
<div style="margin: 4px 15px 10px;">
    <button type="button" class="add-cart-btn" onclick="addSingle()">確定加入購物車</button>
</div>

<div class="category-title">自由混搭 (3+2顆)</div>
<div class="mix-box">
    <label style="font-size:0.8rem; color:#666;">主口味 (3顆)：</label>
    <select id="free-3btn" onchange="updateFreeMixPreview()"></select>
    <label style="font-size:0.8rem; color:#666;">副口味 (2顆)：</label>
    <select id="free-2btn" onchange="updateFreeMixPreview()"></select>
    <div id="free-mix-preview" style="display:none;"></div>
    <button class="mix-add" onclick="addFreeMix()">確認混搭加入購物車</button>
</div>

<div class="category-title">超值快選組合 (3+2顆)</div>
<div class="mix-box">
    <select id="fixed-mix-select" onchange="updateFixedMixOptions()"></select>
    <div id="fixed-mix-config" style="display:none;">
        <select id="fixed-3btn" onchange="showMixPreview()"></select>
        <div id="mix-preview-text" style="display:none;"></div>
        <button class="mix-add mix-add-red" onclick="addFixedMix()">確認加入 $ <span id="fixed-p">0</span></button>
    </div>
</div>

<div class="cart-bar">
    <div>總計：<span id="cart-total" style="font-size:1.4rem; color:#d32f2f; font-weight:bold;">$0</span>　<span id="cart-qty" style="font-size:1rem; font-weight:bold;">0 份</span></div>
    <button type="button" class="btn-cart" onclick="showCart()">購物車</button>
</div>
<div id="cart-overlay" onclick="hideCart()">
    <div class="cart-panel" onclick="event.stopPropagation()">
        <h3>購物車</h3>
        <div id="custom-cart-list"></div>
        <div style="text-align:center; margin:10px 0 12px; font-weight:800;">確認總計：<span id="cart-panel-total" style="color:#d32f2f; font-size:1.25rem;">$0</span>　<span id="cart-panel-qty">0 份</span></div>
        <button type="button" class="btn-submit" style="width:100%; margin-bottom:8px;" onclick="showPaySelect()">確認後送出訂單</button>
        <button type="button" class="pay-btn pickup-btn-sub" onclick="hideCart()">關閉</button>
    </div>
</div>

<div id="overlay" class="overlay"><div id="ticket-content" class="ticket"></div></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, doc, getDocs, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ORDER_KEY = 'redhood_active_orders';
    const ORDER_KEY_OLD = 'redhood_active_order';
    let pickupUnsubs = {};
    let pickupOrders = {};
    let keepPickupOpen = false;
    let lastPickupStatus = {};
    let lastPickupEdit = {};
    let lastCancelledNo = '';
    let lastCancelReason = '';
    let reviseOrderId = null;
    let storeModeNow = 'open';

    function paintClosedOverlay() {
        const overlay = document.getElementById('closed-overlay');
        if (storeModeNow === 'open' || reviseOrderId) {
            overlay.style.display = 'none';
            return;
        }
        overlay.style.display = 'flex';
        if (storeModeNow === 'delivery') {
            overlay.style.background = 'rgba(230,126,34,0.98)';
            document.getElementById('store-overlay-icon').innerText = '🛵';
            document.getElementById('store-overlay-title').innerText = '外送中！';
            document.getElementById('store-overlay-msg').innerText = '老闆正在外送，暫時無法點餐。';
        } else {
            overlay.style.background = 'rgba(211,47,47,0.98)';
            document.getElementById('store-overlay-icon').innerText = '🌙';
            document.getElementById('store-overlay-title').innerText = '老闆休息囉！';
            document.getElementById('store-overlay-msg').innerText = '目前非營業時間，暫時無法點餐。';
        }
    }

    function loadOrderIds() {
        try {
            const v = JSON.parse(localStorage.getItem(ORDER_KEY) || '[]');
            if (Array.isArray(v)) return v.filter(Boolean);
            if (typeof v === 'string' && v) return [v];
        } catch (e) {}
        const old = localStorage.getItem(ORDER_KEY_OLD);
        return old ? [old] : [];
    }
    function saveOrderIds(ids) {
        localStorage.setItem(ORDER_KEY, JSON.stringify(ids));
        localStorage.removeItem(ORDER_KEY_OLD);
    }
    function addOrderId(id) {
        const ids = loadOrderIds();
        if (!ids.includes(id)) ids.push(id);
        saveOrderIds(ids);
    }

    function hidePickupTicket() {
        keepPickupOpen = false;
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'none';
        overlay.classList.remove('pickup-mode');
    }

    function clearPickup() {
        keepPickupOpen = false;
        lastPickupStatus = {};
        lastCancelledNo = '';
        lastCancelReason = '';
        Object.keys(pickupUnsubs).forEach(id => pickupUnsubs[id]());
        pickupUnsubs = {};
        pickupOrders = {};
        saveOrderIds([]);
        document.getElementById('pickup-chip').style.display = 'none';
        document.getElementById('pickup-chip').innerText = '查看取餐資訊';
        hidePickupTicket();
    }

    function dropPickup(id) {
        if (pickupUnsubs[id]) { pickupUnsubs[id](); delete pickupUnsubs[id]; }
        delete pickupOrders[id];
        delete lastPickupStatus[id];
        saveOrderIds(loadOrderIds().filter(x => x !== id));
    }

    function reopenPickup() {
        if (!loadOrderIds().length) return;
        keepPickupOpen = true;
        paintPickup(true);
    }

    function pickupButtons() {
        return `<button type="button" class="pay-btn pickup-btn-main" style="margin-top:12px;" onclick="hidePickupTicket()">好的，繼續點餐</button>`;
    }

    function parseLineItems(str) {
        return (str || '').split(', ').filter(Boolean).map(s => {
            const i = s.lastIndexOf('x');
            if (i < 0) return { name: s, qty: 1 };
            const q = parseInt(s.slice(i + 1), 10);
            return { name: s.slice(0, i), qty: Number.isFinite(q) ? q : 1 };
        });
    }
    function soldOutLabel(od) {
        if (od.soldOutItems) return od.soldOutItems;
        const next = {};
        parseLineItems(od.proposedItems).forEach(it => { next[it.name] = it.qty; });
        const names = [];
        parseLineItems(od.items).forEach(it => {
            if ((next[it.name] || 0) < it.qty && !names.includes(it.name)) names.push(it.name);
        });
        return names.join('、');
    }
    function renderPickupHtml(id, od) {
        const no = od.orderNo;
        const disc = od.discounted ? `<p style="color:#c62828; font-weight:bold;">已折價 $${od.discount || 40}</p><p>實付 ${od.total}</p>` : '';
        const contract = od.contractPrice ? `<p style="color:#2e7d32; font-weight:bold;">特約價 每份折 $5（共 ${od.contractQty || ''} 份）</p>` : '';
        if (od.editProposed) {
            const sold = soldOutLabel(od);
            const soldLine = sold ? `${sold}已完售` : '部分品項已完售';
            return `<div class="waiting-box" style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed #e53935;"><h2>品項已完售</h2><p>您的取餐序號</p><div class="order-num">${no}</div>
                <div style="background:#fff3e0;border:2px solid #ef6c00;border-radius:12px;padding:10px;margin:8px 0;color:#e65100;text-align:left;">
                    <b>${soldLine}</b>
                    <p style="margin:8px 0 0;">請更改品項、同意，或取消訂單</p>
                    <p style="margin:8px 0 4px;">原品項</p><p style="margin:0;">${od.items || ''}</p>
                    <p style="margin:8px 0 4px;">可供應</p><p style="margin:0;font-weight:bold;">${od.proposedItems || ''}</p>
                    <p style="margin:8px 0 0;">金額 ${od.proposedTotal || ''}</p>
                </div>
                <button type="button" class="pay-btn pickup-btn-main" onclick="agreeEdit('${id}')">同意</button>
                <button type="button" class="pay-btn pickup-btn-sub" onclick="startRevise('${id}')">更改品項</button>
                <button type="button" class="pay-btn pickup-btn-cancel" onclick="cancelOrder('${id}')">取消訂單</button>
            </div>`;
        }
        if (od.status === "confirmed") {
            const readyHtml = od.readyTime
                ? `<p>可取餐時間</p><div class="ready-time">${od.readyTime}</div><p style="color:#666; margin:0;">約 ${od.waitMinutes || ''} 分鐘後取餐</p>`
                : `<p>請現場等候，謝謝！</p>`;
            return `<div class="waiting-box" style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed #e53935;"><h2>✅ 老闆已接單！</h2><p>您的取餐序號</p><div class="order-num">${no}</div>${readyHtml}${contract}${disc}</div>`;
        }
        return `<div class="waiting-box" style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px dashed #e53935;"><p>您的取餐序號</p><div class="order-num">${no}</div>${contract}<p style="margin:8px 0;">${od.items || ''}<br>金額 ${od.total}</p><div class="status-badge pulse">⏳ 等待老闆接單中...</div></div>`;
    }

    function paintPickup(forceOpen) {
        const ids = loadOrderIds();
        const live = ids.map(id => pickupOrders[id] && pickupOrders[id].status !== 'finished' ? { id, od: pickupOrders[id] } : null).filter(Boolean);
        const chip = document.getElementById('pickup-chip');
        if (!live.length) {
            if (!ids.length) {
                chip.style.display = 'none';
                if (lastCancelledNo !== '') {
                    document.getElementById('ticket-content').innerHTML = `<div class="waiting-box"><h2>❌ 訂單已取消</h2><p>${lastCancelReason === 'customer' ? '您已取消訂單。' : '老闆取消了您的訂單。'}</p><button type="button" class="pay-btn pickup-btn-sub" onclick="clearPickup()">知道了</button></div>`;
                    const overlay = document.getElementById('overlay');
                    overlay.classList.add('pickup-mode');
                    overlay.style.display = 'flex';
                    lastCancelledNo = '';
                    lastCancelReason = '';
                }
            }
            return;
        }
        lastCancelledNo = '';
        chip.style.display = 'block';
        const first = live[0].od;
        chip.innerText = live.length > 1
            ? `取餐資訊 ${live.length} 筆　${live.map(x => x.od.orderNo).join('、')}　（點此查看）`
            : (first.editProposed
                ? `取餐 ${first.orderNo}　請回覆：同意、更改或取消　（點此查看）`
                : (first.status === 'confirmed' && first.readyTime
                ? `取餐 ${first.orderNo}　可取餐 ${first.readyTime}　（點此查看）`
                : `取餐 ${first.orderNo}　等待接單中　（點此查看）`));
        const needReply = live.some(x => x.od.editProposed);
        document.getElementById('ticket-content').innerHTML = live.map(x => renderPickupHtml(x.id, x.od)).join('') + (needReply ? '' : pickupButtons());
        if (forceOpen || keepPickupOpen) {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('pickup-mode');
            overlay.style.display = 'flex';
            keepPickupOpen = true;
        }
    }

    function watchPickup(orderId, openNow) {
        addOrderId(orderId);
        if (openNow) keepPickupOpen = true;
        if (pickupUnsubs[orderId]) pickupUnsubs[orderId]();
        pickupUnsubs[orderId] = onSnapshot(doc(db, "orders", orderId), (snap) => {
            if (!snap.exists()) {
                if (lastCancelReason !== 'customer') lastCancelReason = 'boss';
                lastCancelledNo = orderId;
                dropPickup(orderId);
                paintPickup(true);
                return;
            }
            const od = snap.data();
            if (od.status === "finished") {
                dropPickup(orderId);
                paintPickup(keepPickupOpen);
                if (!loadOrderIds().length) hidePickupTicket();
                return;
            }
            const changed = lastPickupStatus[orderId] && lastPickupStatus[orderId] !== od.status;
            const editedNow = od.editAt && lastPickupEdit[orderId] !== od.editAt;
            lastPickupStatus[orderId] = od.status;
            lastPickupEdit[orderId] = od.editAt || '';
            pickupOrders[orderId] = od;
            paintPickup(openNow || keepPickupOpen || changed || editedNow);
            openNow = false;
        });
    }

    window.agreeEdit = async (id) => {
        try {
            const oref = doc(db, 'orders', id);
            const os = await getDoc(oref);
            if (!os.exists()) return;
            const o = os.data();
            if (!o.editProposed) return;
            if (reviseOrderId === id) { reviseOrderId = null; paintClosedOverlay(); }
            const q = o.proposedQty || 0;
            await updateDoc(oref, {
                status: 'pending',
                items: o.proposedItems,
                total: o.proposedTotal,
                originalTotal: o.proposedTotal,
                edited: true,
                editProposed: false,
                editRejected: false,
                editAgreed: true,
                customerRevised: false,
                proposedItems: '',
                proposedTotal: '',
                proposedQty: 0,
                proposedMinutes: 0,
                soldOutItems: '',
                editAt: Date.now(),
                pointsEarned: o.contractPrice ? 0 : q
            });
        } catch (e) {
            alert('請再試一次');
        }
    };
    window.cancelOrder = async (id) => {
        if (!confirm('確定要取消這筆訂單嗎？')) return;
        try {
            lastCancelReason = 'customer';
            if (reviseOrderId === id) { reviseOrderId = null; paintClosedOverlay(); }
            await deleteDoc(doc(db, 'orders', id));
        } catch (e) {
            lastCancelReason = '';
            alert('請再試一次');
        }
    };
    window.startRevise = (id) => {
        if (!pickupOrders[id]) return;
        reviseOrderId = id;
        restoreCartFromOrder(pickupOrders[id]);
        hidePickupTicket();
        paintClosedOverlay();
    };
    window.hidePickupTicket = hidePickupTicket;
    window.clearPickup = clearPickup;
    window.reopenPickup = reopenPickup;
    loadOrderIds().forEach(id => watchPickup(id, false));

    onSnapshot(doc(db, "settings", "storeStatus"), s => {
        const data = s.exists() ? s.data() : { isOpen: true };
        storeModeNow = data.mode || (data.isOpen === false ? 'closed' : 'open');
        paintClosedOverlay();
    });

    const baseMenu = [
        { name: "古早原味", price: 40 }, { name: "爆漿奶油", price: 45 }, { name: "熔岩巧克力", price: 45 }, 
        { name: "肉鬆沙拉", price: 45 }, { name: "黃金起司", price: 50 }, { name: "玉米起司", price: 50 }, 
        { name: "鮪魚起司", price: 50 }, { name: "半月OREO", price: 55 }, { name: "蛋黃奶酥", price: 55 }
    ];

    const fixedMixGroup = [
        { items: ["爆漿奶油", "熔岩巧克力"], price: 45 }, { items: ["爆漿奶油", "肉鬆沙拉"], price: 45 },
        { items: ["肉鬆沙拉", "熔岩巧克力"], price: 45 }, { items: ["黃金起司", "玉米起司"], price: 50 },
        { items: ["黃金起司", "鮪魚起司"], price: 50 }, { items: ["玉米起司", "鮪魚起司"], price: 50 },
        { items: ["半月OREO", "蛋黃奶酥"], price: 55 }
    ];

    let cart = {}; let pickQty = {}; let customItems = []; let soldOutList = []; let limited = { name: "", price: 0 };
    window.currentFreeMixPrice = 0;

    onSnapshot(doc(db, "settings", "menuStatus"), s => { soldOutList = s.exists() ? s.data().soldOut || [] : []; render(); });
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { if(s.exists()){ limited = s.data(); render(); }});

    function render() {
        let singleHtml = "";
        let currentSingle = [...baseMenu];
        if (limited.name) currentSingle.push({ name: limited.name, price: limited.price, isLtd: true });

        currentSingle.forEach(item => {
            const isSold = soldOutList.includes(item.name);
            singleHtml += `<div class="menu-item" style="${isSold?'opacity:0.5':''}">
                <div class="item-info"><b>${item.isLtd?'⭐':''}${item.name}</b><span>$${item.price}</span></div>
                <div class="qty-controls">${isSold ? '<span style="color:red">售完</span>' : `<button type="button" class="btn-qty" onclick="updateQty('${item.name}',-1)">-</button><span id="q-${item.name}">${pickQty[item.name]||0}</span><button type="button" class="btn-qty" onclick="updateQty('${item.name}',1)">+</button>`}</div>
            </div>`;
        });
        document.getElementById('single-list').innerHTML = singleHtml;

        let mixOptions = [...baseMenu];
        if (limited.name) mixOptions.push({ name: `⭐${limited.name}`, realName: limited.name });
        const optionsHtml = '<option value="">請選擇</option>' + mixOptions.map(i => `<option value="${i.realName || i.name}" ${soldOutList.includes(i.realName || i.name)?'disabled':''}>${i.name}</option>`).join('');
        document.getElementById('free-3btn').innerHTML = optionsHtml;
        document.getElementById('free-2btn').innerHTML = optionsHtml;

        let fixedOpt = '<option value="">-- 超值組合 --</option>';
        fixedMixGroup.forEach((g, idx) => {
            const isSold = g.items.some(n => soldOutList.includes(n));
            fixedOpt += `<option value="${idx}" ${isSold?'disabled':''}>${g.items.join('+')} ($${g.price})</option>`;
        });
        document.getElementById('fixed-mix-select').innerHTML = fixedOpt;
    }

    window.updateFreeMixPreview = () => {
        const m3 = document.getElementById('free-3btn').value;
        const m2 = document.getElementById('free-2btn').value;
        const pre = document.getElementById('free-mix-preview');
        if(m3 && m2) {
            const all = [...baseMenu]; if(limited.name) all.push(limited);
            const p3 = all.find(i=>i.name===m3)?.price || 0;
            const p2 = all.find(i=>i.name===m2)?.price || 0;
            const max = Math.max(p3, p2);
            window.currentFreeMixPrice = max;
            pre.innerHTML = `已選：<b>${m3}(3)+${m2}(2)</b><br>計算價格：<b style="color:#d32f2f;">$${max}</b>`;
            pre.style.display = 'block';
        } else { pre.style.display = 'none'; }
    };

    window.addFreeMix = () => {
        const m3 = document.getElementById('free-3btn').value;
        const m2 = document.getElementById('free-2btn').value;
        if(!m3 || !m2) return alert("請選好兩種口味！");
        customItems.push({ name: `[自選]${m3}(3)+${m2}(2)`, price: window.currentFreeMixPrice });
        document.getElementById('free-3btn').value = ""; document.getElementById('free-2btn').value = "";
        document.getElementById('free-mix-preview').style.display = 'none'; refreshCart();
    };

    window.updateFixedMixOptions = () => {
        const idx = document.getElementById('fixed-mix-select').value;
        const box = document.getElementById('fixed-mix-config');
        if(!idx) { box.style.display = 'none'; return; }
        const group = fixedMixGroup[idx];
        document.getElementById('fixed-p').innerText = group.price;
        document.getElementById('fixed-3btn').innerHTML = group.items.map(n => `<option value="${n}">${n} (3顆)</option>`).join('');
        box.style.display = 'block'; showMixPreview();
    };

    window.showMixPreview = () => {
        const main = document.getElementById('fixed-3btn').value;
        const idx = document.getElementById('fixed-mix-select').value;
        const other = fixedMixGroup[idx].items.find(i => i !== main);
        const pre = document.getElementById('mix-preview-text');
        pre.innerHTML = `已選：<b>${main}(3顆)</b> + <b>${other}(2顆)</b>`; pre.style.display = 'block';
    };

    window.addFixedMix = () => {
        const idx = document.getElementById('fixed-mix-select').value;
        const main = document.getElementById('fixed-3btn').value;
        const group = fixedMixGroup[idx];
        const other = group.items.find(i => i !== main);
        customItems.push({ name: `[混搭]${main}(3)+${other}(2)`, price: group.price }); refreshCart();
    };

    window.updateQty = (n, c) => { pickQty[n] = (pickQty[n] || 0) + c; if(pickQty[n] <= 0) pickQty[n] = 0; render(); };
    window.addSingle = () => {
        const names = Object.keys(pickQty).filter(n => (pickQty[n] || 0) > 0);
        if (!names.length) return alert('請先選擇數量');
        names.forEach(n => { cart[n] = (cart[n] || 0) + pickQty[n]; pickQty[n] = 0; });
        refreshCart(); render();
    };
    window.removeCartItem = (n) => { delete cart[n]; refreshCart(); };
    window.removeItem = (i) => { customItems.splice(i,1); refreshCart(); };
    function restoreCartFromOrder(o) {
        const all = [...baseMenu];
        if (limited.name) all.push(limited);
        const priceOf = (n) => all.find(x => x.name === n)?.price || 40;
        const skip = {};
        (soldOutLabel(o) || '').split('、').forEach(n => { if (n) skip[n] = true; });
        soldOutList.forEach(n => { skip[n] = true; });
        cart = {};
        pickQty = {};
        customItems = [];
        (o.items || '').split(', ').filter(Boolean).forEach(s => {
            const i = s.lastIndexOf('x');
            const name = i < 0 ? s : s.slice(0, i);
            const qty = i < 0 ? 1 : (parseInt(s.slice(i + 1), 10) || 1);
            if (skip[name]) return;
            const mix = String(name).match(/\[(?:自選|混搭)\](.+?)\(3\)\+(.+?)\(2\)/);
            if (mix) {
                if (skip[mix[1]] || skip[mix[2]]) return;
                const price = Math.max(priceOf(mix[1]), priceOf(mix[2]));
                for (let n = 0; n < qty; n++) customItems.push({ name, price });
            } else {
                cart[name] = (cart[name] || 0) + qty;
            }
        });
        refreshCart();
        render();
    }
    function refreshCart() {
        const all = [...baseMenu]; if (limited.name) all.push(limited);
        const singleRows = Object.keys(cart).map(n => {
            const item = all.find(i => i.name === n);
            if (!item) return '';
            return `<div class="cart-row"><span>${n} x${cart[n]} <b>$${item.price * cart[n]}</b></span><span onclick="removeCartItem('${n}')" style="color:#c62828;font-weight:800;">移除</span></div>`;
        }).join('');
        const mixRows = customItems.map((m,i)=>`<div class="cart-row"><span>${m.name} <b>$${m.price}</b></span><span onclick="removeItem(${i})" style="color:#c62828;font-weight:800;">移除</span></div>`).join('');
        document.getElementById('custom-cart-list').innerHTML = (singleRows + mixRows) || '<div class="cart-row cart-empty">尚未加入品項</div>';
        calc();
    }
    window.showCart = () => {
        refreshCart();
        document.getElementById('cart-overlay').style.display = 'flex';
    };
    window.hideCart = () => {
        document.getElementById('cart-overlay').style.display = 'none';
    };
    function calc() {
        let t = 0; let q = 0; const all = [...baseMenu]; if(limited.name) all.push(limited);
        Object.keys(cart).forEach(n => { const item = all.find(i=>i.name===n); if(item) { t += item.price*cart[n]; q += cart[n]; } });
        customItems.forEach(m => { t += m.price; q += 1; });
        document.getElementById('cart-total').innerText = `$${t}`;
        document.getElementById('cart-qty').innerText = `${q} 份`;
        const pt = document.getElementById('cart-panel-total');
        const pq = document.getElementById('cart-panel-qty');
        if (pt) pt.innerText = `$${t}`;
        if (pq) pq.innerText = `${q} 份`;
    }

    window.showPaySelect = () => {
        hideCart();
        const totalStr = document.getElementById('cart-total').innerText;
        if(totalStr === "$0") return alert("購物車是空的喔！");
        const overlay = document.getElementById('overlay');
        overlay.classList.remove('pickup-mode');
        overlay.style.display = 'flex';
        submitOrder(totalStr);
    };

    window.submitOrder = async (t) => {
        const noteEl = document.getElementById('order-note');
        const note = noteEl ? (noteEl.value || "無") : "無";
        const ticket = document.getElementById('ticket-content');
        ticket.innerHTML = `<div class="waiting-box"><h2 class="pulse">訂單傳送中...</h2></div>`;
        try {
            let itemsArr = [];
            let pointsEarned = 0;
            Object.keys(cart).forEach(n => { itemsArr.push(`${n}x${cart[n]}`); pointsEarned += cart[n]; });
            customItems.forEach(ci => { itemsArr.push(`${ci.name}x1`); pointsEarned += 1; });
            const items = itemsArr.join(', ');
            const replacing = reviseOrderId && pickupOrders[reviseOrderId] && pickupOrders[reviseOrderId].status === 'pending';
            if (replacing) {
                const id = reviseOrderId;
                const o = pickupOrders[id];
                await updateDoc(doc(db, 'orders', id), {
                    items,
                    note,
                    total: t,
                    originalTotal: t,
                    pointsEarned: o.contractPrice ? 0 : pointsEarned,
                    status: 'pending',
                    editProposed: false,
                    editRejected: false,
                    edited: false,
                    editAgreed: false,
                    customerRevised: true,
                    proposedItems: '',
                    proposedTotal: '',
                    proposedQty: 0,
                    proposedMinutes: 0,
                    soldOutItems: '',
                    editAt: Date.now()
                });
                reviseOrderId = null;
                cart = {}; pickQty = {}; customItems = []; refreshCart(); render();
                paintClosedOverlay();
                watchPickup(id, true);
                return;
            }
            const qSnap = await getDocs(collection(db, "orders"));
            const no = qSnap.size + 1;
            const docRef = await addDoc(collection(db, "orders"), { orderNo: no, items, note: note, total: t, originalTotal: t, time: new Date().toLocaleTimeString('zh-TW', {hour12:false, hour:'2-digit', minute:'2-digit'}), timestamp: serverTimestamp(), status: "pending" });
            cart = {}; pickQty = {}; customItems = []; refreshCart(); render();
            watchPickup(docRef.id, true);
        } catch (e) { alert("系統忙碌！"); }
    };
    refreshCart();
</script>
</body>
</html>
