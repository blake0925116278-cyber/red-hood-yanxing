<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小紅帽雞蛋糕鹽行店</title>
    <style>
        :root { --red: #d32f2f; --yellow: #fbc02d; --bg: #fffde7; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); padding-bottom: 140px; -webkit-user-select: none; }
        .header { background: var(--red); color: white; text-align: center; padding: 15px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .section-title { background: var(--yellow); padding: 8px 15px; font-weight: bold; margin: 15px 0; border-radius: 0 20px 20px 0; display: inline-block; font-size: 0.9rem; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .item-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-info h4 { margin: 0; font-size: 1.05rem; color: #444; }
        .item-info p { margin: 4px 0 0; color: var(--red); font-weight: bold; font-size: 1.1rem; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red); background: white; color: var(--red); font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
        .btn-circle.active { background: var(--red); color: white; }
        .qty { font-weight: bold; min-width: 25px; text-align: center; font-size: 1.2rem; color: #333; }
        .cart-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 20px 30px; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0; z-index: 100; }
        .cart-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .total-price { color: var(--red); font-size: 1.6rem; font-weight: 900; }
        .btn-submit { width: 100%; background: #333; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; }
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; align-items: center; justify-content: center; }
        .ticket { background: white; width: 85%; padding: 30px; border-radius: 25px; text-align: center; }
        .order-num { font-size: 4.5rem; color: var(--red); font-weight: 900; margin: 15px 0; border: 3px dashed var(--yellow); border-radius: 15px; padding: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; letter-spacing: 2px;">小紅帽雞蛋糕</h2>
    <div style="font-size:0.8rem; margin-top:4px; opacity: 0.9;">鹽行店 • 現點現烤好滋味</div>
</div>

<div class="container">
    <div class="section-title">經典單一口味 (每份5顆)</div>
    <div id="single-menu"></div>
    <div class="section-title">超值混搭 (3+2 顆)</div>
    <div id="mix-menu"></div>
</div>

<div class="cart-bar">
    <div class="cart-info">
        <span style="color:#666;">合計：<strong id="total-qty" style="color:#333;">0</strong> 份</span>
        <span class="total-price">$<span id="total-amount">0</span></span>
    </div>
    <button class="btn-submit" onclick="submitOrder()">確認送出訂單</button>
</div>

<div id="overlay">
    <div class="ticket">
        <h3 style="margin:0; color:#2ecc71; font-size: 1.5rem;">✓ 訂單已發送</h3>
        <p style="color:#666; margin: 10px 0;">您的取餐編號</p>
        <div class="order-num" id="order-no">#---</div>
        <p style="font-weight:bold; color: #444;">請向櫃檯出示此畫面並付款</p>
        <button onclick="location.reload()" style="background:#f4f4f4; border:1px solid #ddd; padding:12px; width:100%; border-radius:10px; margin-top: 20px; font-size: 1rem;">返回菜單</button>
    </div>
</div>

<script>
    const menuData = {
        single: [
            { id: 's1', name: "古早原味", price: 40 },
            { id: 's2', name: "爆漿奶油", price: 45 },
            { id: 's3', name: "熔岩巧克力", price: 45 },
            { id: 's4', name: "肉鬆沙拉", price: 45 },
            { id: 's5', name: "黃金起司", price: 50 },
            { id: 's6', name: "玉米起司", price: 50 },
            { id: 's7', name: "鮪魚起司", price: 50 },
            { id: 's8', name: "半月OREO", price: 55 },
            { id: 's9', name: "蛋黃奶酥", price: 55 }
        ],
        mix: [
            { id: 'm1', name: "奶油 + 巧克力", price: 45 },
            { id: 'm2', name: "奶油 + 肉鬆", price: 45 },
            { id: 'm3', name: "肉鬆 + 巧克力", price: 45 },
            { id: 'm4', name: "起司 + 玉米", price: 50 },
            { id: 'm5', name: "起司 + 鮪魚", price: 50 },
            { id: 'm6', name: "玉米 + 鮪魚", price: 50 },
            { id: 'm7', name: "OREO + 奶酥", price: 55 }
        ]
    };

    let cart = {};

    function render() {
        document.getElementById('single-menu').innerHTML = menuData.single.map(item => createItemHtml(item)).join('');
        document.getElementById('mix-menu').innerHTML = menuData.mix.map(item => createItemHtml(item)).join('');
    }

    function createItemHtml(item) {
        const count = cart[item.id] || 0;
        return `
            <div class="item-card">
                <div class="item-info">
                    <h4>${item.name}</h4>
                    <p>$${item.price}</p>
                </div>
                <div class="controls">
                    ${count > 0 ? `<button class="btn-circle" onclick="changeQty('${item.id}', -1)">-</button>` : ''}
                    ${count > 0 ? `<span class="qty">${count}</span>` : ''}
                    <button class="btn-circle active" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
            </div>
        `;
    }

    function changeQty(id, delta) {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] <= 0) delete cart[id];
        updateUI();
    }

    function updateUI() {
        render();
        let totalQty = 0;
        let totalAmount = 0;
        const allItems = [...menuData.single, ...menuData.mix];
        
        Object.keys(cart).forEach(id => {
            const item = allItems.find(i => i.id === id);
            if(item) {
                totalQty += cart[id];
                totalAmount += item.price * cart[id];
            }
        });

        document.getElementById('total-qty').innerText = totalQty;
        document.getElementById('total-amount').innerText = totalAmount;
    }

    function submitOrder() {
        if (document.getElementById('total-qty').innerText === "0") return alert("請先選購餐點喔！");
        const orderNo = Math.floor(Math.random() * 900) + 100;
        document.getElementById('order-no').innerText = `#${orderNo}`;
        document.getElementById('overlay').style.display = 'flex';
    }

    render();
</script>

</body>
</html>
