<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小紅帽雞蛋糕 - 線上點餐</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f8f9fa; padding: 0; margin: 0; color: #333; padding-bottom: 120px; }
        .header { background: #d32f2f; color: #fff; padding: 15px; text-align: center; border-radius: 0 0 20px 20px; }
        .container { padding: 15px; }
        .category-title { font-weight: bold; margin: 20px 0 10px; color: #d32f2f; border-left: 4px solid #d32f2f; padding-left: 8px; }
        .item-card { background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-bottom: 8px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item-info b { font-size: 1.05rem; display: block; }
        .item-info span { color: #d32f2f; font-weight: bold; }
        .add-btn { background: #d32f2f; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .add-btn:disabled { background: #ccc; }
        .mix-box { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; background: #fafafa; }
        #mix-preview-text { margin: 5px 0 12px; padding: 10px; background: #fff9e1; border: 1px dashed #FBC02D; border-radius: 8px; font-size: 0.95rem; color: #444; text-align: center; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 15px; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .btn-send { background: #2e7d32; color: #fff; border: none; padding: 12px 25px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0;">小紅帽雞蛋糕</h2>
    <p style="margin:5px 0 0; font-size:0.8rem; opacity:0.9;">每份 5 顆 · 純鮮奶製作</p>
</div>

<div class="container">
    <div class="category-title">單點口味 (每份5顆)</div>
    <div id="menu-list"></div>

    <div class="category-title">混搭方式 (3 + 2 顆)</div>
    <div class="mix-box">
        <label style="font-size:0.85rem; color:#666;">選擇組合：</label>
        <select id="fixed-mix-select" onchange="updateFixedMixOptions()"></select>
        <div id="fixed-mix-config" style="display:none;">
            <label style="font-size:0.85rem; color:#d32f2f; font-weight:bold;">誰要 3 顆？</label>
            <select id="fixed-3btn" onchange="showMixPreview()"></select>
            <div id="mix-preview-text" style="display:none;"></div>
            <button onclick="addFixedMix()" style="width:100%; padding:12px; background:#d32f2f; color:white; border:none; border-radius:10px; font-weight:bold;">確認加入 $ <span id="fixed-p">0</span></button>
        </div>
    </div>

    <div class="category-title">購物車</div>
    <div id="cart-list" style="background:#eee; padding:10px; border-radius:10px; font-size:0.9rem; color:#666;">尚未點餐</div>
</div>

<div class="cart-bar">
    <div>總計：<b style="font-size:1.5rem; color:#d32f2f;">$<span id="total-price">0</span></b></div>
    <button class="btn-send" onclick="sendOrder()">確認下單</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc", authDomain: "myordersystem-dee08.firebaseapp.com", projectId: "myordersystem-dee08", storageBucket: "myordersystem-dee08.firebasestorage.app", messagingSenderId: "775750661450", appId: "1:775750661450:web:e56f00456f0285c8bebdb3" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- 完全對齊照片價格 ---
    const baseItems = [
        { n: "古早原味", p: 40 }, 
        { n: "爆漿奶油", p: 45 }, { n: "熔岩巧克力", p: 45 }, { n: "肉鬆沙拉", p: 45 },
        { n: "黃金起司", p: 50 }, { n: "玉米起司", p: 50 }, { n: "鮪魚起司", p: 50 },
        { n: "半月OREO", p: 55 }, { n: "蛋黃奶酥", p: 55 }
    ];

    const fixedMixGroup = [
        { items: ["爆漿奶油", "熔岩巧克力"], price: 45 },
        { items: ["爆漿奶油", "肉鬆沙拉"], price: 45 },
        { items: ["肉鬆沙拉", "熔岩巧克力"], price: 45 },
        { items: ["黃金起司", "玉米起司"], price: 50 },
        { items: ["黃金起司", "鮪魚起司"], price: 50 },
        { items: ["玉米起司", "鮪魚起司"], price: 50 },
        { items: ["半月OREO", "蛋黃奶酥"], price: 55 }
    ];

    let cart = [];
    let soldOutList = [];
    let ltdItem = null;

    onSnapshot(doc(db, "settings", "menuStatus"), s => { soldOutList = s.exists() ? s.data().soldOut || [] : []; renderMenu(); });
    onSnapshot(doc(db, "settings", "limitedEdition"), s => { ltdItem = s.exists() ? s.data() : null; renderMenu(); });

    function renderMenu() {
        const list = document.getElementById('menu-list');
        let items = [...baseItems];
        if (ltdItem && ltdItem.name) items.push({ n: ltdItem.name, p: ltdItem.price, isLtd: true });
        list.innerHTML = items.map(i => {
            const isSold = soldOutList.includes(i.n);
            return `<div class="item-card"><div class="item-info"><b>${i.isLtd ? '⭐' : ''}${i.n}</b><span>$${i.p}</span></div>
                    <button class="add-btn" onclick="addToCart('${i.n}', ${i.p})" ${isSold ? 'disabled' : ''}>${isSold ? '完' : '加入'}</button></div>`;
        }).join('');
        const ms = document.getElementById('fixed-mix-select');
        ms.innerHTML = '<option value="">請選擇混搭組合...</option>' + fixedMixGroup.map((g, idx) => `<option value="${idx}">${g.items.join(' + ')} ($${g.price})</option>`).join('');
    }

    window.updateFixedMixOptions = () => {
        const idx = document.getElementById('fixed-mix-select').value;
        const config = document.getElementById('fixed-mix-config');
        if(!idx) { config.style.display = 'none'; return; }
        const group = fixedMixGroup[idx];
        document.getElementById('fixed-p').innerText = group.price;
        document.getElementById('fixed-3btn').innerHTML = group.items.map(n => `<option value="${n}">${n} (3顆)</option>`).join('');
        config.style.display = 'block';
        showMixPreview();
    };

    window.showMixPreview = () => {
        const main = document.getElementById('fixed-3btn').value;
        const idx = document.getElementById('fixed-mix-select').value;
        if(!main || !idx) return;
        const group = fixedMixGroup[idx];
        const other = group.items.find(i => i !== main);
        const preview = document.getElementById('mix-preview-text');
        preview.innerHTML = `🛒 已選：<b>${main} (3顆)</b> + <b>${other} (2顆)</b>`;
        preview.style.display = 'block';
    };

    window.addToCart = (n, p) => {
        const exist = cart.find(i => i.n === n);
        if (exist) exist.q++; else cart.push({ n, p, q: 1 });
        refreshCart();
    };

    window.addFixedMix = () => {
        const idx = document.getElementById('fixed-mix-select').value;
        const main = document.getElementById('fixed-3btn').value;
        const group = fixedMixGroup[idx];
        const other = group.items.find(i => i !== main);
        const name = `[混搭]${main}(3)+${other}(2)`;
        const exist = cart.find(i => i.n === name);
        if (exist) exist.q++; else cart.push({ n: name, p: group.price, q: 1 });
        document.getElementById('fixed-mix-select').value = "";
        document.getElementById('fixed-mix-config').style.display = "none";
        refreshCart();
    };

    function refreshCart() {
        const list = document.getElementById('cart-list');
        if (cart.length === 0) { list.innerHTML = "尚未點餐"; document.getElementById('total-price').innerText = "0"; return; }
        let total = 0;
        list.innerHTML = cart.map((i, idx) => {
            total += (i.p * i.q);
            return `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${i.n} x ${i.q}</span><span onclick="window.removeCart(${idx})" style="color:#d32f2f;">移除</span></div>`;
        }).join('');
        document.getElementById('total-price').innerText = total;
    }

    window.removeCart = (idx) => { cart.splice(idx, 1); refreshCart(); };

    window.sendOrder = async () => {
        if (cart.length === 0) return alert("請先點餐");
        if (!confirm("確認下單？")) return;
        const orderNo = Math.floor(Math.random() * 900) + 100;
        const orderData = {
            orderNo: orderNo,
            items: cart.map(i => `${i.n}x${i.q}`).join(', '),
            total: `NT$${document.getElementById('total-price').innerText}`,
            time: new Date().toLocaleTimeString('zh-TW', {hour12: false, hour: '2-digit', minute:'2-digit'}),
            timestamp: Date.now(),
            payMethod: "現場付款",
            status: "pending"
        };
        try {
            await addDoc(collection(db, "orders"), orderData);
            alert(`下單成功！序號：#${orderNo}`);
            cart = []; refreshCart();
        } catch (e) { alert("失敗，請重試"); }
    };
</script>
</body>
</html>
