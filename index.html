<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小紅帽雞蛋糕</title>
    <style>
        :root { --red: #d32f2f; --yellow: #fbc02d; --bg: #fffde7; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); padding-bottom: 140px; -webkit-user-select: none; }
        .header { background: var(--red); color: white; text-align: center; padding: 15px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .section-title { background: var(--yellow); padding: 8px 15px; font-weight: bold; margin: 15px 0; border-radius: 0 20px 20px 0; display: inline-block; font-size: 0.9rem; }
        .item-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .item-info h4 { margin: 0; font-size: 1.05rem; }
        .item-info p { margin: 4px 0 0; color: var(--red); font-weight: bold; }
        .controls { display: flex; align-items: center; gap: 15px; }
        .btn-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red); background: white; color: var(--red); font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-circle.active { background: var(--red); color: white; }
        .qty { font-weight: bold; min-width: 25px; text-align: center; font-size: 1.2rem; }
        .cart-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: white; padding: 15px 20px 30px; box-sizing: border-box; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); border-radius: 20px 20px 0 0; }
        .cart-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .total-price { color: var(--red); font-size: 1.5rem; font-weight: bold; }
        .btn-submit { width: 100%; background: #333; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; }
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:200; align-items: center; justify-content: center; }
        .ticket { background: white; width: 80%; padding: 30px; border-radius: 25px; text-align: center; }
        .order-num { font-size: 4rem; color: var(--red); font-weight: 900; margin: 15px 0; border: 2px dashed var(--yellow); border-radius: 10px; }
    </style>
</head>
<body>
<div class="header"><h2>小紅帽雞蛋糕</h2><p>鹽行店</p></div>
<div class="container">
    <div class="section-title">經典口味</div><div id="single-menu"></div>
    <div class="section-title">混搭口味</div><div id="mix-menu"></div>
</div>
<div class="cart-bar">
    <div class="cart-info"><span>份數: <strong id="total-qty">0</strong></span><span class="total-price">$<span id="total-amount">0</span></span></div>
    <button class="btn-submit" onclick="submitOrder()">確認送出</button>
</div>
<div id="overlay"><div class="ticket"><h3>✓ 訂單已發送</h3><div class="order-num" id="order-no">#000</div><button onclick="location.reload()">返回</button></div></div>
<script>
    const menu = {
        single: [{id:'s1', name:"原味", price:40}, {id:'s2', name:"奶油", price:45}, {id:'s3', name:"巧克力", price:45}],
        mix: [{id:'m1', name:"奶油+巧克力", price:45}, {id:'m2', name:"起司+玉米", price:50}]
    };
    let cart = {};
    function render() {
        document.getElementById('single-menu').innerHTML = menu.single.map(i => createHtml(i)).join('');
        document.getElementById('mix-menu').innerHTML = menu.mix.map(i => createHtml(i)).join('');
    }
    function createHtml(i) {
        const n = cart[i.id] || 0;
        return `<div class="item-card"><div><h4>${i.name}</h4><p>$${i.price}</p></div>
        <div class="controls">${n>0?`<button class="btn-circle" onclick="add('${i.id}',-1)">-</button><span class="qty">${n}</span>`:''}<button class="btn-circle active" onclick="add('${i.id}',1)">+</button></div></div>`;
    }
    function add(id, d) {
        cart[id] = (cart[id] || 0) + d;
        if(cart[id]<=0) delete cart[id];
        let q=0, a=0;
        [...menu.single, ...menu.mix].forEach(i => { if(cart[i.id]){ q+=cart[i.id]; a+=cart[i.id]*i.price; } });
        document.getElementById('total-qty').innerText = q;
        document.getElementById('total-amount').innerText = a;
        render();
    }
    function submitOrder() {
        if(document.getElementById('total-qty').innerText === "0") return;
        document.getElementById('order-no').innerText = '#' + (Math.floor(Math.random()*900)+100);
        document.getElementById('overlay').style.display = 'flex';
    }
    render();
</script>
</body>
</html>
