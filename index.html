<script type="module">
    // 1. 引入 Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 2. 你的 Firebase 配置
    const firebaseConfig = {
        apiKey: "AIzaSyAbG0YttR57SQ5Xr_xPTKY1DoVgPtcnJzc",
        authDomain: "myordersystem-dee08.firebaseapp.com",
        projectId: "myordersystem-dee08",
        storageBucket: "myordersystem-dee08.firebasestorage.app",
        messagingSenderId: "775750661450",
        appId: "1:775750661450:web:e56f00456f0285c8bebdb3",
        measurementId: "G-DD5GHKG99Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const menuData = {
        single: [
            { id: 's1', name: "古早原味", price: 40 },
            { id: 's2', name: "爆漿奶油", price: 45 },
            { id: 's3', name: "熔岩巧克力", price: 45 },
            { id: 's4', name: "肉鬆沙拉", price: 45 },
            { id: 's5', name: "黃金起司", price: 50 },
            { id: 's6', name: "玉米起司", price: 50 },
            { id: 's7', name: "鮪魚起司", price: 50 },
            { id: 's8', name: "半月OREO", price: 55 },
            { id: 's9', name: "蛋黃奶酥", price: 55 }
        ],
        mix: [
            { id: 'm1', name: "奶油 + 巧克力", price: 45 },
            { id: 'm2', name: "奶油 + 肉鬆", price: 45 },
            { id: 'm3', name: "肉鬆 + 巧克力", price: 45 },
            { id: 'm4', name: "起司 + 玉米", price: 50 },
            { id: 'm5', name: "起司 + 鮪魚", price: 50 },
            { id: 'm6', name: "玉米 + 鮪魚", price: 50 },
            { id: 'm7', name: "OREO + 奶酥", price: 55 }
        ]
    };

    let cart = {};

    function render() {
        document.getElementById('single-menu').innerHTML = menuData.single.map(item => createItemHtml(item)).join('');
        document.getElementById('mix-menu').innerHTML = menuData.mix.map(item => createItemHtml(item)).join('');
    }

    function createItemHtml(item) {
        const count = cart[item.id] || 0;
        return `
            <div class="item-card">
                <div class="item-info"><h4>${item.name}</h4><p>$${item.price}</p></div>
                <div class="controls">
                    ${count > 0 ? `<button class="btn-circle" onclick="changeQty('${item.id}', -1)">-</button>` : ''}
                    ${count > 0 ? `<span class="qty">${count}</span>` : ''}
                    <button class="btn-circle active" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
            </div>
        `;
    }

    // 將函數綁定到 window 物件，確保按鈕點擊得到
    window.changeQty = (id, delta) => {
        cart[id] = (cart[id] || 0) + delta;
        if (cart[id] <= 0) delete cart[id];
        updateUI();
    };

    function updateUI() {
        render();
        let q = 0, a = 0;
        const all = [...menuData.single, ...menuData.mix];
        Object.keys(cart).forEach(id => {
            const item = all.find(i => i.id === id);
            if(item) { q += cart[id]; a += item.price * cart[id]; }
        });
        document.getElementById('total-qty').innerText = q;
        document.getElementById('total-amount').innerText = a;
    }

    window.showReview = () => {
        const totalQty = document.getElementById('total-qty').innerText;
        if (totalQty === "0") return alert("請先選購餐點喔！");
        const all = [...menuData.single, ...menuData.mix];
        let listHtml = '';
        let total = 0;
        Object.keys(cart).forEach(id => {
            const item = all.find(i => i.id === id);
            const subtotal = item.price * cart[id];
            total += subtotal;
            listHtml += `<div class="confirm-item"><span>${item.name} x ${cart[id]}</span><span>$${subtotal}</span></div>`;
        });
        document.getElementById('ticket-content').innerHTML = `
            <h3 style="margin-top:0;">核對訂單明細</h3>
            <div class="confirm-list">${listHtml}</div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.2rem; color:var(--red);">
                <span>總計金額</span><span>$${total}</span>
            </div>
            <button class="btn-final" id="confirm-btn" onclick="finalSubmit()">確認無誤，送出訂單</button>
            <button class="btn-cancel" onclick="closeOverlay()">返回加點</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    };

    // 3. 送出訂單到 Firebase
    window.finalSubmit = async () => {
        const btn = document.getElementById('confirm-btn');
        btn.disabled = true;
        btn.innerText = "傳送中...";

        try {
            const all = [...menuData.single, ...menuData.mix];
            let itemsString = "";
            Object.keys(cart).forEach(id => {
                const item = all.find(i => i.id === id);
                itemsString += `${item.name} x ${cart[id]} `;
            });

            // 寫入 Firebase 的 orders 集合
            await addDoc(collection(db, "orders"), {
                items: itemsString,
                status: "準備中",
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: serverTimestamp()
            });

            const orderNo = Math.floor(Math.random() * 900) + 100;
            document.getElementById('ticket-content').innerHTML = `
                <h3 style="color:#2ecc71; margin-top:0;">✓ 訂單已發送</h3>
                <p style="color:#666;">您的取餐編號</p>
                <div class="order-num">#${orderNo}</div>
                <p style="font-weight:bold;">請向櫃檯出示此畫面結帳</p>
                <button class="btn-cancel" onclick="location.reload()">完成點餐</button>
            `;
        } catch (e) {
            alert("送出失敗，請檢查網路：" + e.message);
            btn.disabled = false;
            btn.innerText = "重新送出";
        }
    };

    window.closeOverlay = () => { document.getElementById('overlay').style.display = 'none'; };
    render();
</script>
</body>
</html>
